name: Atlas Daily Briefing Integration v1

on:
  schedule:
    # 07:05 KST daily morning slot.  Weekends still produce a fail-closed
    # briefing from the latest confirmed history; "market closed / no new
    # session" is a valid morning result, not a reason to skip the round.
    - cron: "5 22 * * *"
    # 18:30 KST weekday evening slot -- after the P0-04 18:00 KRX post-close
    # cutoff. Mon-Fri UTC == Mon-Fri KST same day.
    - cron: "30 9 * * 1-5"
  # A manual/operator entry point for re-running or draining a slot.
  #
  # NOT a recovery guarantee. The "P0-02/P0-04 independent-cron pattern" is
  # staggered GitHub Actions crons, i.e. the same failure plane, and the
  # external consumer contract is read-only (retrieval_pointer_only: true), so
  # it has no authority to fire this. No caller exists today. A same-day
  # automatic retrigger remains the disclosed upstream blocker
  # SAME_DAY_AUTOMATIC_RECOVERY_TRIGGER_NOT_SCHEDULED, and a cron to manufacture
  # one was deliberately rejected there -- so none is added here either.
  repository_dispatch:
    types: [atlas-briefing-run, atlas-finalization-drain]
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or evening (required for brief mode)"
        required: false
        type: choice
        options:
          - morning
          - evening
      mode:
        description: "brief = normal round / drain = recover undelivered only"
        required: false
        default: brief
        type: choice
        options:
          - brief
          - drain
      decision_date:
        description: "KST YYYY-MM-DD (drain recovery; defaults to today)"
        required: false
        type: string
      portal_canary:
        description: "Manual Notion CI write/readback canary before adapter activation"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: atlas-daily-briefing
  cancel-in-progress: false

jobs:
  # Production publication must not wait behind a multi-minute regression
  # suite.  Keep the exact same checks on every invocation, but run them in a
  # parallel job so the 07:05/18:30 retrieval-authority SLA is not consumed by
  # tests that already ran in CI before merge.
  offline-regression:
    runs-on: [self-hosted, Linux, X64, atlas-data]
    # The provenance-heavy identity checks repeatedly walk full git history.
    # They complete well inside this bound on the isolated runner, but can
    # exceed the former GitHub-hosted 15-minute budget on a cold checkout.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Offline daily orchestrator regression
        run: |
          python3 test/test_daily_orchestrator.py
          python3 test/test_decision_change_lineage_operational.py
          python3 test/test_three_market_shadow_operational_readiness.py

  briefing:
    runs-on: [self-hosted, Linux, X64, atlas-data]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Re-sync to the latest main before binding retrieval authority
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"
      # Resolves slot/mode/date for all three triggers BEFORE the producer runs.
      # It cannot live inside the producer step: in `drain` mode that step is
      # skipped entirely, so the decision to skip it cannot be made there.
      - name: Resolve slot, mode and decision date
        id: resolve
        env:
          DISPATCH_SLOT: ${{ inputs.slot }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_DATE: ${{ inputs.decision_date }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_ACTION: ${{ github.event.action }}
          PAYLOAD_SLOT: ${{ github.event.client_payload.slot }}
          PAYLOAD_MODE: ${{ github.event.client_payload.mode }}
          PAYLOAD_DATE: ${{ github.event.client_payload.decision_date }}
        run: |
          set -euo pipefail
          MODE="brief"; SLOT=""; DECISION_DATE=""
          case "${{ github.event_name }}" in
            schedule)
              case "$EVENT_SCHEDULE" in
                "5 22 * * *") SLOT="morning" ;;
                "30 9 * * 1-5") SLOT="evening" ;;
                *) echo "STOP: unrecognized schedule expression: $EVENT_SCHEDULE" >&2; exit 2 ;;
              esac
              ;;
            workflow_dispatch)
              SLOT="${DISPATCH_SLOT:-}"
              MODE="${DISPATCH_MODE:-brief}"
              DECISION_DATE="${DISPATCH_DATE:-}"
              ;;
            repository_dispatch)
              # The event type is the authority, not the payload. A payload
              # claiming mode=brief must not be able to turn a drain request
              # into a briefing run.
              case "$EVENT_ACTION" in
                atlas-finalization-drain) MODE="drain" ;;
                atlas-briefing-run)       MODE="brief" ;;
                *) echo "STOP: unsupported dispatch type '$EVENT_ACTION'" >&2; exit 2 ;;
              esac
              if [ -n "${PAYLOAD_MODE:-}" ] && [ "${PAYLOAD_MODE}" != "$MODE" ]; then
                echo "STOP: client_payload.mode '${PAYLOAD_MODE}' contradicts dispatch type '$EVENT_ACTION'" >&2
                exit 2
              fi
              SLOT="${PAYLOAD_SLOT:-}"
              DECISION_DATE="${PAYLOAD_DATE:-}"
              ;;
            *) echo "STOP: unsupported event ${{ github.event_name }}" >&2; exit 2 ;;
          esac
          case "$MODE" in
            brief|drain) ;;
            *) echo "STOP: unsupported mode '$MODE'" >&2; exit 2 ;;
          esac
          if [ "$MODE" = "brief" ]; then
            case "$SLOT" in
              morning|evening) ;;
              *) echo "STOP: brief mode requires a slot" >&2; exit 2 ;;
            esac
          fi
          if [ -n "$DECISION_DATE" ]; then
            echo "$DECISION_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
              || { echo "STOP: malformed decision_date '$DECISION_DATE'" >&2; exit 2; }
          else
            DECISION_DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "decision_date=$DECISION_DATE" >> "$GITHUB_OUTPUT"

      - name: Publish provider-free daily briefing packet
        if: steps.resolve.outputs.mode == 'brief'
        id: briefing
        env:
          # Fed by the resolver so repository_dispatch reaches the producer at
          # all -- `inputs.slot` is empty for that event.
          DISPATCH_SLOT: ${{ steps.resolve.outputs.slot }}
          RESOLVED_DATE: ${{ steps.resolve.outputs.decision_date }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          SLOT="$DISPATCH_SLOT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Determine the slot from the exact cron expression that fired,
            # not from the KST wall-clock hour the runner happens to start
            # at -- a large scheduler delay could push a morning run past
            # noon KST and misclassify it as evening if hour were used.
            case "$EVENT_SCHEDULE" in
              "5 22 * * *") SLOT="morning" ;;
              "30 9 * * 1-5") SLOT="evening" ;;
              *)
                echo "STOP: unrecognized schedule expression: $EVENT_SCHEDULE" >&2
                exit 2
                ;;
            esac
          fi
          case "$SLOT" in
            morning|evening) ;;
            *) echo "STOP: unsupported slot" >&2; exit 2 ;;
          esac
          # Supplied by the resolver so every trigger agrees on one date.
          DECISION_DATE="$RESOLVED_DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DELIVERY_CHANGED=false

          # Phase A commits the briefing bundle and H-24 locator first.  The
          # P0-06 source_commit must name a commit that already contains those
          # consumer-ready bytes; binding the pre-publication checkout would
          # make the locator impossible to retrieve from the advertised SHA.
          for ATTEMPT in 1 2; do
            if [ "$ATTEMPT" -gt 1 ]; then
              git fetch origin "$DEFAULT_BRANCH"
              git reset --hard "origin/$DEFAULT_BRANCH"
            fi
            GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # Always call publish -- it is the one that decides, from real
            # evidence, whether anything changed since the last revision for
            # this (slot, decision_date). A prior run may have published a
            # revision with several components DATA_BLOCKED because their
            # capture had not landed yet; this call re-aggregates from
            # whatever now exists and adds a new revision only if that
            # materially changed something (same-day recovery), otherwise it
            # is a safe no-op.
            OUTPUT=$(python3 briefing/daily_orchestrator.py publish \
              --slot "$SLOT" \
              --decision-date "$DECISION_DATE" \
              --generated-at "$GENERATED_AT")
            echo "$OUTPUT"
            CAPTURE_PATH=$(echo "$OUTPUT" | sed -n 's/^path=//p')
            CREATED=$(echo "$OUTPUT" | sed -n 's/^created=//p')

            python3 briefing/daily_orchestrator.py validate "$CAPTURE_PATH/packet.json"
            LOCATOR_OUTPUT=$(python3 .github/scripts/daily_briefing_delivery.py publish-locator \
              --slot "$SLOT" \
              --decision-date "$DECISION_DATE")
            echo "$LOCATOR_OUTPUT"
            LOCATOR_CHANGED=$(echo "$LOCATOR_OUTPUT" | sed -n 's/^locator_changed=//p')

            # Consume exactly what the locator names. This is the H-24
            # producer -> locator -> consumer delivery proof; no directory
            # scan, prior-date fallback, or alternate-slot guess is allowed.
            python3 .github/scripts/daily_briefing_delivery.py consume \
              --slot "$SLOT" \
              --decision-date "$DECISION_DATE" \
              > /tmp/investment-review-delivery.md

            if [ "$CREATED" != "true" ] && [ "$LOCATOR_CHANGED" != "true" ]; then
              LOCAL_COMMIT=$(git rev-parse HEAD)
              git fetch origin "$DEFAULT_BRANCH"
              REMOTE_COMMIT=$(git rev-parse "origin/$DEFAULT_BRANCH")
              if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then
                if [ "$ATTEMPT" -eq 2 ]; then
                  echo "STOP: main advanced twice while confirming unchanged delivery" >&2
                  exit 1
                fi
                echo "main advanced while delivery appeared unchanged; rebuilding once" >&2
                continue
              fi
              CONSUMER_READY_COMMIT="$LOCAL_COMMIT"
              break
            fi

            git add "$(dirname "$CAPTURE_PATH")"
            git add data/briefing/daily_briefing_sources.json
            git commit -m "daily briefing $SLOT ${CAPTURE_PATH##*/}"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              test -z "$(git status --porcelain)" || {
                echo "STOP: uncommitted output remained after daily briefing commit" >&2
                exit 1
              }
              CONSUMER_READY_COMMIT=$(git rev-parse HEAD)
              DELIVERY_CHANGED=true
              break
            fi
            if [ "$ATTEMPT" -eq 2 ]; then
              echo "STOP: main advanced twice; no briefing locator was published" >&2
              exit 1
            fi
            echo "main advanced while the briefing locator was built; rebuilding once" >&2
          done

          # Phase B publishes the P0-06 append-only retrieval bootstrap before
          # any downstream lineage/Shadow work.  A valid briefing packet must
          # remain retrievable even when an independent downstream validator
          # correctly fails closed.  The bootstrap is still bound to the
          # immutable Phase-A commit and never grants decision/trading authority.
          AUTHORITY_CHANGED=false
          AUTHORITY_PATH=""
          for ATTEMPT in 1 2; do
            if [ "$ATTEMPT" -gt 1 ]; then
              git fetch origin "$DEFAULT_BRANCH"
              git reset --hard "origin/$DEFAULT_BRANCH"
            fi
            AUTHORITY_OUTPUT=$(python3 .github/scripts/publish_scheduled_briefing_authority.py publish \
              --slot "$SLOT" \
              --expected-kst-date "$DECISION_DATE" \
              --source-commit "$CONSUMER_READY_COMMIT")
            echo "$AUTHORITY_OUTPUT"
            AUTHORITY_PATH=$(echo "$AUTHORITY_OUTPUT" | sed -n 's/^authority_path=//p')
            AUTHORITY_CHANGED=$(echo "$AUTHORITY_OUTPUT" | sed -n 's/^authority_changed=//p')
            python3 .github/scripts/publish_scheduled_briefing_authority.py validate \
              --slot "$SLOT" \
              --expected-kst-date "$DECISION_DATE" \
              --source-commit "$CONSUMER_READY_COMMIT" \
              --authority-path "$AUTHORITY_PATH"
            if [ "$AUTHORITY_CHANGED" != "true" ]; then
              break
            fi
            git add "$AUTHORITY_PATH"
            git commit -m "scheduled briefing retrieval authority $SLOT $DECISION_DATE"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              test -z "$(git status --porcelain)" || {
                echo "STOP: uncommitted output remained after authority commit" >&2
                exit 1
              }
              break
            fi
            if [ "$ATTEMPT" -eq 2 ]; then
              echo "STOP: main advanced twice; no authority bootstrap was published" >&2
              exit 1
            fi
            echo "main advanced while publishing authority; retrying from latest main" >&2
          done

          # Phase C records downstream operational sidecars.  These are
          # intentionally isolated from P0-06: a lineage or Shadow semantic
          # rejection writes no sidecar and remains BLOCKED_FAIL_CLOSED, while
          # the already-validated retrieval bootstrap stays available to the
          # read-only AM/PM consumer.
          LINEAGE_CHANGED=false
          LINEAGE_PATH=""
          LINEAGE_STATUS=PASS
          SHADOW_READINESS_CHANGED=false
          SHADOW_READINESS_PATH=""
          SHADOW_READINESS_STATUS=PASS
          RUN_RECEIPT_CHANGED=false
          RUN_RECEIPT_PATH=""
          ACCEPTANCE_CHANGED=false
          ACCEPTANCE_PATH=""
          for ATTEMPT in 1 2; do
            if [ "$ATTEMPT" -gt 1 ]; then
              git fetch origin "$DEFAULT_BRANCH"
              git reset --hard "origin/$DEFAULT_BRANCH"
            fi
            LINEAGE_RECORDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            set +e
            LINEAGE_OUTPUT=$(python3 decision/decision_change_lineage_operational.py \
              "$CAPTURE_PATH/packet.json" \
              --source-commit "$CONSUMER_READY_COMMIT" \
              --recorded-at "$LINEAGE_RECORDED_AT" 2>&1)
            LINEAGE_RC=$?
            set -e
            echo "$LINEAGE_OUTPUT"
            if [ "$LINEAGE_RC" -eq 0 ]; then
              LINEAGE_PATH=$(echo "$LINEAGE_OUTPUT" | sed -n 's/^record_path=//p')
              LINEAGE_CHANGED=$(echo "$LINEAGE_OUTPUT" | sed -n 's/^record_created=//p')
              LINEAGE_STATUS=PASS
            else
              LINEAGE_PATH=""
              LINEAGE_CHANGED=false
              LINEAGE_STATUS=BLOCKED_FAIL_CLOSED
              echo "::warning::Decision lineage sidecar blocked fail-closed; retrieval authority remains valid"
            fi
            set +e
            SHADOW_READINESS_OUTPUT=$(python3 shadow/three_market_shadow_operational_readiness.py \
              "$CAPTURE_PATH/packet.json" \
              --source-commit "$CONSUMER_READY_COMMIT" \
              --recorded-at "$LINEAGE_RECORDED_AT" 2>&1)
            SHADOW_READINESS_RC=$?
            set -e
            echo "$SHADOW_READINESS_OUTPUT"
            if [ "$SHADOW_READINESS_RC" -eq 0 ]; then
              SHADOW_READINESS_PATH=$(echo "$SHADOW_READINESS_OUTPUT" | sed -n 's/^readiness_path=//p')
              SHADOW_READINESS_CHANGED=$(echo "$SHADOW_READINESS_OUTPUT" | sed -n 's/^readiness_created=//p')
              SHADOW_READINESS_STATUS=PASS
            else
              SHADOW_READINESS_PATH=""
              SHADOW_READINESS_CHANGED=false
              SHADOW_READINESS_STATUS=BLOCKED_FAIL_CLOSED
              echo "::warning::Shadow readiness sidecar blocked fail-closed; retrieval authority remains valid"
            fi
            RUN_RECEIPT_OUTPUT=$(python3 -m acceptance.capital_rotation_e2e publish-run-receipt \
              --event-name "$EVENT_NAME" \
              --event-schedule "$EVENT_SCHEDULE" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
              --decision-date "$DECISION_DATE" \
              --slot "$SLOT" \
              --source-commit "$CONSUMER_READY_COMMIT" \
              --authority-path "$AUTHORITY_PATH")
            echo "$RUN_RECEIPT_OUTPUT"
            RUN_RECEIPT_PATH=$(echo "$RUN_RECEIPT_OUTPUT" | sed -n 's/^run_receipt_path=//p')
            RUN_RECEIPT_CHANGED=$(echo "$RUN_RECEIPT_OUTPUT" | sed -n 's/^run_receipt_changed=//p')
            ACCEPTANCE_OUTPUT=$(python3 -m acceptance.capital_rotation_e2e evaluate)
            echo "$ACCEPTANCE_OUTPUT"
            ACCEPTANCE_PATH=$(echo "$ACCEPTANCE_OUTPUT" | sed -n 's/^acceptance_path=//p')
            ACCEPTANCE_CHANGED=$(echo "$ACCEPTANCE_OUTPUT" | sed -n 's/^acceptance_changed=//p')
            python3 -m acceptance.capital_rotation_e2e validate-inventory "$ACCEPTANCE_PATH"
            if [ "$LINEAGE_CHANGED" != "true" ] && [ "$SHADOW_READINESS_CHANGED" != "true" ] && [ "$RUN_RECEIPT_CHANGED" != "true" ] && [ "$ACCEPTANCE_CHANGED" != "true" ]; then
              break
            fi
            if [ "$LINEAGE_CHANGED" = "true" ]; then
              git add "$LINEAGE_PATH"
            fi
            if [ "$SHADOW_READINESS_CHANGED" = "true" ]; then
              git add "$SHADOW_READINESS_PATH"
            fi
            if [ "$RUN_RECEIPT_CHANGED" = "true" ]; then
              git add "$RUN_RECEIPT_PATH"
            fi
            if [ "$ACCEPTANCE_CHANGED" = "true" ]; then
              git add "$ACCEPTANCE_PATH"
            fi
            git commit -m "scheduled briefing lineage, Shadow, and P8-15 receipt $SLOT $DECISION_DATE"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              test -z "$(git status --porcelain)" || {
                echo "STOP: uncommitted output remained after sidecar commit" >&2
                exit 1
              }
              break
            fi
            if [ "$ATTEMPT" -eq 2 ]; then
              echo "STOP: main advanced twice; no briefing sidecars were published" >&2
              exit 1
            fi
            echo "main advanced while publishing briefing sidecars; retrying from latest main" >&2
          done

          if [ "$DELIVERY_CHANGED" = "true" ] || [ "$AUTHORITY_CHANGED" = "true" ] || [ "$LINEAGE_CHANGED" = "true" ] || [ "$SHADOW_READINESS_CHANGED" = "true" ] || [ "$RUN_RECEIPT_CHANGED" = "true" ] || [ "$ACCEPTANCE_CHANGED" = "true" ]; then
            RESULT=published
          else
            RESULT=no_new_revision
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "decision_date=$DECISION_DATE" >> "$GITHUB_OUTPUT"
          echo "source_commit=$CONSUMER_READY_COMMIT" >> "$GITHUB_OUTPUT"
          echo "capture_path=$CAPTURE_PATH" >> "$GITHUB_OUTPUT"
          echo "locator_changed=$LOCATOR_CHANGED" >> "$GITHUB_OUTPUT"
          echo "authority_path=$AUTHORITY_PATH" >> "$GITHUB_OUTPUT"
          echo "authority_changed=$AUTHORITY_CHANGED" >> "$GITHUB_OUTPUT"
          echo "lineage_path=$LINEAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "lineage_changed=$LINEAGE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "lineage_status=$LINEAGE_STATUS" >> "$GITHUB_OUTPUT"
          echo "shadow_readiness_path=$SHADOW_READINESS_PATH" >> "$GITHUB_OUTPUT"
          echo "shadow_readiness_changed=$SHADOW_READINESS_CHANGED" >> "$GITHUB_OUTPUT"
          echo "shadow_readiness_status=$SHADOW_READINESS_STATUS" >> "$GITHUB_OUTPUT"
          echo "run_receipt_path=$RUN_RECEIPT_PATH" >> "$GITHUB_OUTPUT"
          echo "run_receipt_changed=$RUN_RECEIPT_CHANGED" >> "$GITHUB_OUTPUT"
          echo "acceptance_path=$ACCEPTANCE_PATH" >> "$GITHUB_OUTPUT"
          echo "acceptance_changed=$ACCEPTANCE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

          # Storage (this workflow committing evidence/daily_briefing/...)
          # is not the same thing as delivery to a person. Publishing the
          # rendered briefing into the job summary is the one delivery path
          # this workflow itself provides; an external read-only reporter
          # (matching the P0-02/P0-04 independent-cron pattern) is the
          # documented path for anything beyond that -- see
          # docs/daily_orchestrator_contract.md for the exact consumption
          # command. Push/email/Claude delivery is not implemented here and
          # must not be reported as done until live delivery evidence
          # exists.
          # The rendered briefing now reaches a person only through the
          # finalization gate, which delivers it once, records what was
          # transmitted, and refuses when a verdict is HOLD or an approval is
          # missing. This step only hands the gate its input.
          if [ -f /tmp/investment-review-delivery.md ]; then
            cp /tmp/investment-review-delivery.md "$RUNNER_TEMP/consume.md"
            echo "consume_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "consume_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seal briefing for finalization
        if: steps.resolve.outputs.mode == 'brief' && steps.briefing.outputs.capture_path != ''
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ steps.briefing.outputs.consume_ready }}" = "true" ]; then
            ARGS="--consume-output $RUNNER_TEMP/consume.md"
          fi
          python3 .github/scripts/briefing_finalization.py seal \
            --slot "${{ steps.resolve.outputs.slot }}" \
            --decision-date "${{ steps.resolve.outputs.decision_date }}" \
            --repo-root . $ARGS

      # The sealed payload must be durable before delivery. `seal` is idempotent
      # on identical input, so a retry reuses the same draft, marker and clock.
      - name: Publish sealed draft
        if: steps.resolve.outputs.mode == 'brief' && steps.briefing.outputs.capture_path != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing/finalization
          git diff --cached --quiet || {
            git commit -m "finalization seal ${{ steps.resolve.outputs.decision_date }} ${{ steps.resolve.outputs.slot }}"
            git push origin "HEAD:$DEFAULT_BRANCH"
          }

      # Record any verdict a previous run published but died before ingesting.
      # Without this a machine HOLD left unrecorded by a dead runner would be
      # ingested for the first time AFTER the validator had already decided
      # there was nothing to withdraw -- costing the fixed briefing a round.
      # Non-fatal on purpose: an unrecordable verdict still fails the gate
      # closed at drain, and swallowing it here would only skip the validator.
      - name: Reconcile verdicts left by a previous run
        if: steps.resolve.outputs.mode == 'brief' && steps.briefing.outputs.capture_path != ''
        run: |
          set -uo pipefail
          python3 .github/scripts/briefing_finalization.py ingest \
            --slot "${{ steps.resolve.outputs.slot }}" \
            --decision-date "${{ steps.resolve.outputs.decision_date }}" \
            --repo-root . || echo "::warning::pending verdict could not be recorded; the gate will fail closed at drain"

      # Deterministic checks only. A clean result is NOT a final PASS: it writes
      # a machine record and leaves the gate's verdict slot open, so the existing
      # fail-open policy still owns the outcome. Exits 0 even on HOLD -- the
      # verdict, not the exit code, is what blocks.
      - name: Run deterministic validator
        if: steps.resolve.outputs.mode == 'brief' && steps.briefing.outputs.capture_path != ''
        run: |
          set -euo pipefail
          python3 .github/scripts/briefing_validator.py \
            --slot "${{ steps.resolve.outputs.slot }}" \
            --decision-date "${{ steps.resolve.outputs.decision_date }}" \
            --repo-root . --emit-inbox

      - name: Publish validator verdict
        if: steps.resolve.outputs.mode == 'brief' && steps.briefing.outputs.capture_path != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add data/briefing/finalization
          git diff --cached --quiet || {
            git commit -m "machine validation ${{ steps.resolve.outputs.decision_date }} ${{ steps.resolve.outputs.slot }}"
            git push origin "HEAD:$DEFAULT_BRANCH"
          }

      # Final Notion SSOT projection is drain-only. The natural producer leaves
      # only a DRAFT/semantic handoff. The named external validator invokes
      # drain after semantic PASS and after the Portal viewer + Portal Notion
      # receipt have been independently verified and recorded source-side.
      - name: Project canonical briefing to Notion SSOT
        if: steps.resolve.outputs.mode == 'drain'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ATLAS_APPROVAL_PUBKEY_FINGERPRINT: ${{ secrets.ATLAS_APPROVAL_PUBKEY_FINGERPRINT }}
          EVENT_NAME: ${{ github.event_name }}
          PORTAL_CANARY: ${{ inputs.portal_canary }}
        run: |
          set -euo pipefail
          ARGS=(--sync-all --repo-root . --decision-date "${{ steps.resolve.outputs.decision_date }}")
          if [ -n "${{ steps.resolve.outputs.slot }}" ]; then
            ARGS+=(--slot "${{ steps.resolve.outputs.slot }}")
          fi
          if [ "${PORTAL_CANARY:-false}" = "true" ]; then
            [ "$EVENT_NAME" = "workflow_dispatch" ] || {
              echo "STOP: portal canary is manual-only" >&2
              exit 2
            }
            ARGS+=(--live-canary)
          fi
          python3 .github/scripts/notion_projection_adapter.py "${ARGS[@]}"

      # drain ingests each stream's authoritative verdict THEN delivers, per
      # item, and exits non-zero while any due slot is still undelivered. A
      # briefing nobody received is not a green build.
      - name: Ingest verdicts and deliver
        if: steps.resolve.outputs.mode == 'drain'
        id: gate
        env:
          ATLAS_APPROVAL_PUBKEY_FINGERPRINT: ${{ secrets.ATLAS_APPROVAL_PUBKEY_FINGERPRINT }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/briefing_finalization.py drain \
            --repo-root . \
            --channel github_step_summary \
            --required-channel github_step_summary > drain.json
          RC=$?
          python3 .github/scripts/report_drain.py drain.json
          rm -f drain.json
          exit "$RC"

      - name: Commit finalization artifacts
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/briefing/finalization ]; then
            git add data/briefing/finalization
          fi
          git diff --cached --quiet || {
            git commit -m "finalization ${{ steps.resolve.outputs.decision_date }}"
            git push origin "HEAD:$DEFAULT_BRANCH"
          }
