name: Atlas Daily Briefing Integration v1

on:
  schedule:
    # 07:05 KST weekday morning slot -- after the 06:57 P0-02 recovery gate,
    # confirmed-history only. Sun-Thu UTC == Mon-Fri KST next day.
    - cron: "5 22 * * 0-4"
    # 18:30 KST weekday evening slot -- after the P0-04 18:00 KRX post-close
    # cutoff. Mon-Fri UTC == Mon-Fri KST same day.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or evening (required for manual dispatch)"
        required: true
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write

concurrency:
  group: atlas-daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Offline daily orchestrator regression
        run: python3 test/test_daily_orchestrator.py
      - name: Publish provider-free daily briefing packet
        id: briefing
        env:
          DISPATCH_SLOT: ${{ inputs.slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          SLOT="$DISPATCH_SLOT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Determine the slot from the exact cron expression that fired,
            # not from the KST wall-clock hour the runner happens to start
            # at -- a large scheduler delay could push a morning run past
            # noon KST and misclassify it as evening if hour were used.
            case "$EVENT_SCHEDULE" in
              "5 22 * * 0-4") SLOT="morning" ;;
              "30 9 * * 1-5") SLOT="evening" ;;
              *)
                echo "STOP: unrecognized schedule expression: $EVENT_SCHEDULE" >&2
                exit 2
                ;;
            esac
          fi
          case "$SLOT" in
            morning|evening) ;;
            *) echo "STOP: unsupported slot" >&2; exit 2 ;;
          esac
          DECISION_DATE=$(TZ=Asia/Seoul date +%F)
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "decision_date=$DECISION_DATE" >> "$GITHUB_OUTPUT"

          # Always call publish -- it is the one that decides, from real
          # evidence, whether anything changed since the last revision for
          # this (slot, decision_date). A prior run may have published a
          # revision with several components DATA_BLOCKED because their
          # capture had not landed yet; this call re-aggregates from
          # whatever now exists and adds a new revision only if that
          # materially changed something (same-day recovery), otherwise it
          # is a safe no-op.
          OUTPUT=$(python3 briefing/daily_orchestrator.py publish \
            --slot "$SLOT" \
            --decision-date "$DECISION_DATE" \
            --generated-at "$GENERATED_AT")
          echo "$OUTPUT"
          CAPTURE_PATH=$(echo "$OUTPUT" | sed -n 's/^path=//p')
          CREATED=$(echo "$OUTPUT" | sed -n 's/^created=//p')
          echo "capture_path=$CAPTURE_PATH" >> "$GITHUB_OUTPUT"

          python3 briefing/daily_orchestrator.py validate "$CAPTURE_PATH/packet.json"
          LOCATOR_OUTPUT=$(python3 .github/scripts/daily_briefing_delivery.py publish-locator \
            --slot "$SLOT" \
            --decision-date "$DECISION_DATE")
          echo "$LOCATOR_OUTPUT"
          LOCATOR_CHANGED=$(echo "$LOCATOR_OUTPUT" | sed -n 's/^locator_changed=//p')
          echo "locator_changed=$LOCATOR_CHANGED" >> "$GITHUB_OUTPUT"

          # Consume exactly what the locator names. This is the H-24
          # producer -> locator -> consumer delivery proof; no directory
          # scan, prior-date fallback, or alternate-slot guess is allowed.
          python3 .github/scripts/daily_briefing_delivery.py consume \
            --slot "$SLOT" \
            --decision-date "$DECISION_DATE" \
            > /tmp/investment-review-delivery.md

          if [ "$CREATED" = "true" ]; then
            echo "result=published" >> "$GITHUB_OUTPUT"
          else
            echo "이미 최신 상태와 동일한 $SLOT/$DECISION_DATE revision이 있어 재발행하지 않습니다: $CAPTURE_PATH" >&2
            echo "result=no_new_revision" >> "$GITHUB_OUTPUT"
          fi

          # Storage (this workflow committing evidence/daily_briefing/...)
          # is not the same thing as delivery to a person. Publishing the
          # rendered briefing into the job summary is the one delivery path
          # this workflow itself provides; an external read-only reporter
          # (matching the P0-02/P0-04 independent-cron pattern) is the
          # documented path for anything beyond that -- see
          # docs/daily_orchestrator_contract.md for the exact consumption
          # command. Push/email/Claude delivery is not implemented here and
          # must not be reported as done until live delivery evidence
          # exists.
          {
            echo "## Atlas Daily Briefing — $SLOT $DECISION_DATE"
            echo
            cat "$CAPTURE_PATH/briefing.md"
            echo
            cat /tmp/investment-review-delivery.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit immutable daily briefing bundle
        if: steps.briefing.outputs.result == 'published' || steps.briefing.outputs.locator_changed == 'true'
        env:
          CAPTURE_PATH: ${{ steps.briefing.outputs.capture_path }}
          SLOT: ${{ steps.briefing.outputs.slot }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole decision_date directory, not just the new
          # rev-NNN/ subdirectory: index.json (the deterministic pointer to
          # the latest revision) lives beside it as a sibling and is
          # rewritten on every new revision.
          git add "$(dirname "$CAPTURE_PATH")"
          git add data/briefing/daily_briefing_sources.json
          git commit -m "daily briefing $SLOT ${CAPTURE_PATH##*/}"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
