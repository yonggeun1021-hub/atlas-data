# TSMC Monthly Revenue Live Validation — 주 1회 + 수동 실행
#
# 정본 acquisition contract 를 그대로 따른다.
#   · primary acquisition = TSMC 가 제출한 SEC EDGAR 6-K
#   · secondary verification = TSMC IR 사람이 확인하는 원발표
# IR WAF 403은 secondary reachability 경고로 남기되 primary SEC 성공을 실패로
# 바꾸지 않는다. UA/브라우저 위장이나 WAF 우회는 하지 않는다.
#
# ⛔ 이 workflow 는 저장소를 쓰지 않는다 — commit · push · fixture 덮어쓰기 없음.
# ⛔ SEC live 실패 시 fixture/IR fallback 없음. primary 실패는 실패로 남는다.
# ⛔ Rule 상태 변경 · evaluator wiring · Production 연결과 무관하다.
# ⛔ `run_all.py` 의 결정론적 회귀에는 네트워크를 넣지 않는다 — 이 검증은 분리돼 있다.
name: tsmc-live-fetch

on:
  schedule:
    # 월별 발표일을 추정하지 않는다. 저부하 주 1회 probe로 source/parser/
    # P4-04 fail-closed adapter 배선만 관측한다 (월요일 10:17 KST).
    - cron: '17 1 * * 1'
  workflow_dispatch:

# ★ 최소 권한 — 읽기만.
permissions:
  contents: read

jobs:
  live-fetch:
    runs-on: ubuntu-latest
    steps:
      # full-length commit SHA pin — tag 는 움직일 수 있다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: TSMC SEC primary offline regression
        run: python3 test/test_tsmc_sec_monthly_probe.py

      - name: TSMC SEC 6-K primary monthly-revenue live validation
        run: |
          python3 collectors/tsmc_sec_monthly_probe.py \
            --out "$RUNNER_TEMP/tsmc-sec-monthly-live-probe.json"

      - name: TSMC SEC primary live probe artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: p4-04-tsmc-sec-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tsmc-sec-monthly-live-probe.json
          if-no-files-found: error

      - name: P4-04 IR secondary adapter offline regression
        if: always()
        run: python3 test/test_official_release_evidence.py

      - name: TSMC IR secondary human-verification reachability
        if: always()
        continue-on-error: true
        run: |
          python3 collectors/tsmc_official_release_probe.py \
            --year "$(date -u +%Y)" \
            --out "$RUNNER_TEMP/tsmc-official-release-live-probe.json"

      - name: P4-04 IR secondary reachability artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: p4-04-tsmc-ir-secondary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tsmc-official-release-live-probe.json
          if-no-files-found: error

      - name: 저장소가 그대로인지 (쓰기 없음 확인)
        if: always()
        run: git diff --exit-code
