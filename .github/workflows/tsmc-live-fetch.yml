# TSMC Live Fetch Validation — 수동 실행 전용
#
# 목적 하나뿐이다: GitHub-hosted runner 가 TSMC 공식 IR 에서 **실제 HTML** 을 받아
# 기존 extractor 가 그대로 해석하는지 검증한다.
#
# ⛔ 이 workflow 는 저장소를 쓰지 않는다 — commit · push · fixture 덮어쓰기 없음.
# ⛔ live 실패 시 fixture fallback 없음. 실패는 실패로 남는다.
# ⛔ Rule 상태 변경 · evaluator wiring · Production 연결과 무관하다.
# ⛔ `run_all.py` 의 결정론적 회귀에는 네트워크를 넣지 않는다 — 이 검증은 분리돼 있다.
name: tsmc-live-fetch

# ★ 수동 실행만. 스케줄도 push 도 pull_request 도 걸지 않는다.
on:
  workflow_dispatch:

# ★ 최소 권한 — 읽기만.
permissions:
  contents: read

jobs:
  live-fetch:
    runs-on: ubuntu-latest
    steps:
      # full-length commit SHA pin — tag 는 움직일 수 있다.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: TSMC 공식 IR live fetch + extraction 검증
        run: python3 collectors/tsmc_live_check.py

      - name: 저장소가 그대로인지 (쓰기 없음 확인)
        run: git diff --exit-code
