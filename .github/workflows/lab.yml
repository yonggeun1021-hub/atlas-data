name: Entry Validation Lab (수동)

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: KR 장기 이력 수집
        env:
          PYTHONPATH: collectors:lab
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LAB_YEARS: '6'
        run: python lab/kr_history.py

      - name: Rule Comparator
        env:
          PYTHONPATH: lab
        run: python lab/rule_comparator.py

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab_result
          path: |
            data/kr_history.json
            data/rule_comparator.json
