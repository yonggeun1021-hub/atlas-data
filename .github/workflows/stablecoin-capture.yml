name: stablecoin-daily-capture

on:
  schedule:
    # 14:50/15:20/16:20/17:20 KST. 첫 complete UTC-date snapshot이 이기고,
    # 뒤 슬롯은 provider 호출 전에 append-only guard에서 종료한다.
    # CRYPTO_PAPER_RUNTIME_V1은 07:00Z에 finalized packet을 확정하므로
    # 05:50Z primary와 06:20Z backup이 cutoff 전 여유를 만든다. 07:20Z/08:20Z
    # 슬롯은 증거 보존용으로 남기며, 그 capture는 runtime에서 lookahead로 거부된다.
    - cron: "50 5 * * *"
    - cron: "20 6 * * *"
    - cron: "20 7 * * *"
    - cron: "20 8 * * *"
  # 수동/자동 dispatch. schedule 경로와 동일한 pending_current_observation
  # guard를 그대로 적용하며, guard를 우회하는 선택지는 존재하지 않는다.
  # default 는 refuse 이므로 input 을 생략한 API dispatch 는 fail-closed 로
  # 거부된다. available_at 을 만들거나 소급할 수 있는 input 은 없다.
  workflow_dispatch:
    inputs:
      guard_mode:
        description: >-
          schedule_equivalent 만 실행된다. 당일 UTC observation row 가 없으면
          schedule 조기 슬롯과 똑같이 pending_current_observation 으로 종료한다.
          refuse(기본값)는 아무것도 capture 하지 않는다.
        required: true
        type: choice
        default: refuse
        options:
          - refuse
          - schedule_equivalent

permissions:
  contents: write

concurrency:
  group: atlas-stablecoin-daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # checkout보다 앞에서 runner 도착 시각을 직접 관측한다.
      - name: Capture runner start time
        id: runner_start
        run: echo "observed_started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # delayed slot도 event 생성 시점의 낡은 SHA가 아니라 실행 시점의
          # 최신 default branch에서 append-only guard를 판단한다.
          ref: ${{ github.event.repository.default_branch }}

      - name: Capture raw snapshot (append-only)
        id: capture
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_GUARD_MODE: ${{ inputs.guard_mode }}
        run: |
          set -euo pipefail

          # Trigger 분류 — provider 호출과 파일 생성보다 먼저, fail-closed.
          # schedule 이 아닌 경로는 guard_mode=schedule_equivalent 를 명시해야
          # 하며, 그 경우에도 아래 pending_current_observation guard 를 schedule
          # 조기 슬롯과 동일하게 통과해야만 capture 한다. guard 를 건너뛰는
          # dispatch 입력은 존재하지 않는다.
          case "${EVENT_NAME:-}" in
            schedule)
              # schedule 이벤트에서 inputs context 는 비어 있다. 혹시 기본값이
              # 채워져 들어오더라도 refuse 는 "dispatch 입력 없음"과 같으므로
              # 예약 경로를 절대 막지 않는다. schedule_equivalent 가 schedule
              # 이벤트에 실려 오는 경우만 거부한다.
              case "${DISPATCH_GUARD_MODE:-}" in
                ""|refuse) ;;
                *)
                  echo "::error::schedule 이벤트에 dispatch input 이 실렸습니다: ${DISPATCH_GUARD_MODE}" >&2
                  echo "result=trigger_input_conflict" >> "$GITHUB_OUTPUT"
                  exit 1
                  ;;
              esac
              CAPTURE_TRIGGER="schedule"
              DISPATCH_GUARD_MODE=""
              ;;
            workflow_dispatch)
              if [ "${DISPATCH_GUARD_MODE:-}" != "schedule_equivalent" ]; then
                echo "::error::dispatch 는 guard_mode=schedule_equivalent 만 허용합니다 (받은 값: '${DISPATCH_GUARD_MODE:-}')" >&2
                echo "result=dispatch_guard_mode_invalid" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              CAPTURE_TRIGGER="workflow_dispatch"
              ;;
            *)
              echo "::error::허용되지 않은 trigger: '${EVENT_NAME:-}'" >&2
              echo "result=trigger_not_authorized" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac
          echo "capture_trigger=$CAPTURE_TRIGGER" >> "$GITHUB_OUTPUT"

          ROOT="$PWD"
          D=$(date -u +%F)
          DIR="evidence/stablecoin/raw/$D"
          echo "snapshot_date=$D" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/_sha256.txt" ]; then
            echo "이미 $D 스냅샷이 존재합니다. 덮어쓰지 않고 종료합니다."
            echo "result=skipped_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -e "$DIR" ]; then
            echo "불완전한 기존 경로가 있어 덮어쓰지 않습니다: $DIR" >&2
            echo "result=incomplete_existing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          STAGING_PARENT=$(mktemp -d "$RUNNER_TEMP/stablecoin.XXXXXX")
          STAGING="$STAGING_PARENT/$D"
          trap 'rm -rf "$STAGING_PARENT"' EXIT
          mkdir -p "$STAGING"
          cd "$STAGING"

          # source_observed_at — 반드시 다운로드 직전에 기록
          date -u +%Y-%m-%dT%H:%M:%SZ > _downloaded_at.txt
          cat _downloaded_at.txt

          fetch () {  # $1=파일명  $2=URL
            curl -sS --fail --retry 3 --retry-delay 5 --max-time 120 -o "$1" "$2"
          }
          fetch stablecoincharts_all.json   "https://stablecoins.llama.fi/stablecoincharts/all"
          fetch stablecoins_withprices.json "https://stablecoins.llama.fi/stablecoins?includePrices=true"
          fetch stablecoinchains.json       "https://stablecoins.llama.fi/stablecoinchains"
          fetch stablecoincharts_Terra.json "https://stablecoins.llama.fi/stablecoincharts/Terra"

          # 원문 sha256 = 정본 해시 (압축 전 기준)
          sha256sum *.json > _sha256.txt
          cat _sha256.txt

          # 유효성 검사 — 하나라도 깨지면 커밋하지 않고 실패
          python3 - <<'PY'
          import json, os, sys
          MIN = {"stablecoincharts_all.json": 500000, "stablecoins_withprices.json": 100000,
                 "stablecoinchains.json": 5000, "stablecoincharts_Terra.json": 5000}
          bad = []
          for f, m in MIN.items():
              n = os.path.getsize(f)
              if n < m:
                  bad.append("%s 크기 부족 %d < %d" % (f, n, m)); continue
              try:
                  d = json.load(open(f))
              except Exception as e:
                  bad.append("%s JSON 실패: %s" % (f, e)); continue
              cnt = len(d) if isinstance(d, list) else len(d.get("peggedAssets", d))
              if cnt < 100:
                  bad.append("%s 레코드 %d개로 너무 적음" % (f, cnt))
              print("%-32s %9d bytes  n=%d" % (f, n, cnt))
          if bad:
              print("검증 실패:", *bad, sep="\n  "); sys.exit(1)
          PY

          # 저장소 용량을 위해 gzip 보관. 원문은 gunzip -c 로 그대로 복원되고
          # _sha256.txt 의 해시로 검증 가능하다.
          gzip -n *.json
          gunzip -c stablecoincharts_all.json.gz | sha256sum | cut -d' ' -f1 > /tmp/rt.txt
          grep -q "$(cat /tmp/rt.txt)" _sha256.txt && echo "round-trip 해시 일치 확인"

          # P1-CR-02 — endpoint 의미와 PIT provenance를 기계 판독 가능한
          # manifest로 남기고, 네 응답 전체를 production contract로 검증한다.
          python3 "$ROOT/.github/scripts/stablecoin_revision_contract.py" manifest \
            --snapshot-dir "$PWD" \
            --collector-version "stablecoin-capture/v2"
          python3 "$ROOT/.github/scripts/stablecoin_revision_contract.py" validate "$PWD"

          # 이른 예약 슬롯에서 당일 UTC observation row가 아직 없으면 append-only
          # 경로를 만들지 않고 종료한다. 뒤 슬롯이 같은 날짜를 다시 시도한다.
          # 판정 자체가 실패하면 원문을 잃지 않도록 capture를 계속하고, 마지막
          # 08:20Z 슬롯과 수동 실행은 항상 capture한다(07:00Z 이후 capture는
          # runtime에서 lookahead로 거부된다).
          CURRENT_ROW=$(python3 - "$ROOT/.github/scripts/stablecoin_net_issuance.py" "$PWD" <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("stablecoin_net_issuance", sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          packet = module.build_transform(Path(sys.argv[2]))
          latest = max(row["observation_date"] for row in packet["rows"])
          print("present" if latest == packet["lineage"]["vintage_date"] else "absent")
          PY
          ) || CURRENT_ROW="check_error"
          if [ "$CURRENT_ROW" = "check_error" ]; then
            # schedule 경로는 원문을 잃지 않도록 계속한다(기존 확정 동작).
            # dispatch 는 guard 를 판정할 수 없으면 아무것도 쓰지 않는다.
            if [ "$CAPTURE_TRIGGER" = "workflow_dispatch" ]; then
              echo "::error::current-row check 실패 — dispatch 는 guard 미판정 상태로 capture 하지 않습니다" >&2
              echo "result=dispatch_guard_undetermined" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::current-row check failed; capturing the snapshot anyway"
          fi
          GUARD_APPLIES=no
          if [ "$CAPTURE_TRIGGER" = "workflow_dispatch" ]; then
            # dispatch 에는 08:20Z final-slot 예외가 없다. 그 예외까지 주면
            # dispatch 가 schedule 이 거부한 기록을 쓸 수 있게 된다.
            GUARD_APPLIES=yes
          elif [ "${EVENT_SCHEDULE:-}" != "20 8 * * *" ]; then
            GUARD_APPLIES=yes
          fi
          if [ "$CURRENT_ROW" = "absent" ] && [ "$GUARD_APPLIES" = "yes" ]; then
            echo "당일 UTC observation row가 아직 없어 뒤 슬롯에서 다시 시도합니다."
            echo "result=pending_current_observation" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # trigger provenance — _sha256.txt 와 _manifest.json 이 이미 확정된
          # 뒤에 쓴다. revision contract 의 checksum inventory 와 manifest 는
          # 건드리지 않으며, available_at 은 여기서 나오지 않는다(원문 fetch
          # 시각인 _downloaded_at.txt 가 유일한 출처다).
          python3 - "$CAPTURE_TRIGGER" "${EVENT_SCHEDULE:-}" "${DISPATCH_GUARD_MODE:-}" \
            "$CURRENT_ROW" "$GUARD_APPLIES" <<'PY'
          import json, sys
          from pathlib import Path
          trigger, schedule, guard_mode, current_row, guard_applies = sys.argv[1:6]
          record = {
              "schema_version": 1,
              "trigger": trigger,
              "event_schedule": schedule or None,
              "dispatch_guard_mode": guard_mode or None,
              "current_row_check": current_row,
              "pending_current_observation_guard": (
                  "ENFORCED" if guard_applies == "yes"
                  else "EXEMPT_SCHEDULE_FINAL_SLOT_20_8"
              ),
              "available_at_source": "_downloaded_at.txt",
              "available_at_supplied_by_trigger": False,
          }
          Path("_trigger.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat _trigger.json

          cd "$ROOT"
          mkdir -p "$(dirname "$DIR")"
          mv "$STAGING" "$DIR"
          trap - EXIT
          rm -rf "$STAGING_PARENT"
          echo "result=captured" >> "$GITHUB_OUTPUT"

      # provider를 호출하지 않는 operations telemetry다. capture 실패/skip도
      # 구분할 수 있도록 always()에서 실행한다.
      - name: Record Stablecoin scheduler telemetry
        if: always()
        env:
          ATLAS_EVENT_NAME: ${{ github.event_name }}
          ATLAS_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ATLAS_DISPATCH_GUARD_MODE: ${{ inputs.guard_mode }}
          ATLAS_RUN_ID: ${{ github.run_id }}
          ATLAS_RUN_ATTEMPT: ${{ github.run_attempt }}
          ATLAS_RUNNER_STARTED_AT_UTC: ${{ steps.runner_start.outputs.observed_started_at_utc }}
          ATLAS_CAPTURE_STEP_OUTCOME: ${{ steps.capture.outcome }}
          ATLAS_CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          ATLAS_REPOSITORY: ${{ github.repository }}
          ATLAS_SERVER_URL: ${{ github.server_url }}
        run: python3 .github/scripts/record_stablecoin_run.py

      - name: Populate P3-09 Crypto supply-demand raw features
        if: ${{ steps.capture.outcome == 'success' && steps.capture.outputs.result != 'pending_current_observation' }}
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
        run: |
          set -euo pipefail
          if [ -z "$SNAPSHOT_DATE" ]; then
            echo "P3-09 STOP: snapshot date absent" >&2
            exit 1
          fi
          python3 .github/scripts/stablecoin_supply_demand_population.py \
            --snapshot-dir "evidence/stablecoin/raw/$SNAPSHOT_DATE"

      - name: Commit
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operations/stablecoin_capture_runs || true
          if [ "$CAPTURE_RESULT" = "captured" ]; then
            git add "evidence/stablecoin/raw/$SNAPSHOT_DATE"
          fi
          if [ -n "$SNAPSHOT_DATE" ] && [ -d "evidence/supply_demand/crypto/$SNAPSHOT_DATE" ]; then
            git add "evidence/supply_demand/crypto/$SNAPSHOT_DATE"
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "stablecoin capture ${SNAPSHOT_DATE:-unknown} [${TRIGGER}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
