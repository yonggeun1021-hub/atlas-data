# RULE-0022 Commercial RPO — Observation Layer 통합 경로 (S4A)
#
# ★ 계약 순서 (CIO 판정 2026-08-16 · S4A + H1)
#     checkout → input contract → observe → repository-clean guard
#            → parameter application guard → emitted record validation
#            → persist → resulting store validation → repository-clean guard → artifact upload
#
# ⛔ source 는 명시 선택 없이는 실행되지 않는다 (H1). 기본값으로 fixture 가 내려가던
#    계약은 폐기됐다 — 2026-08-16 첫 live 승인 run 이 그 때문에 무효화됐다.
#
# ⛔ observe 단계는 저장소에 쓰지 않는다 — 그 직후 clean guard 로 강제한다.
#    guard 는 tracked 변경(`git diff --exit-code`)과 untracked 파일(`git status --porcelain`)을
#    **둘 다** 판정에 쓴다 (S4A.1 · REPOSITORY_CLEAN_GUARD_UNTRACKED_GAP).
# ⛔ 관측 실패 후 persist 하지 않는다 · record validation 실패 후 persist 하지 않는다.
# ⛔ CONFLICT / REVISION 이 미해소면 정상 success 로 소비하지 않는다.
# ⛔ schedule 이 없다 — `workflow_dispatch` 전용이다. 자동 발동하지 않는다.
# ⛔ live option 이 노출돼 있어도 **dispatch 는 별도 CIO 승인 1회**다 (S4B).
#    이 파일의 존재가 실행 승인이 아니다.
name: rule0022-observation

on:
  workflow_dispatch:
    inputs:
      source:
        # ★★ H1 (CIO 확정 2026-08-16) — 「실제 데이터인지 연습 데이터인지」를
        #    사용자가 **명시적으로 고르지 않으면 실행되지 않는다.**
        #
        #    ⛔ `default: fixture` 를 지우는 것만으로는 부족하다.
        #       `type: choice` 에서 default 를 생략했을 때 UI 가 **첫 option 을
        #       고른 상태로 보여주는지**는 GitHub 공식 문서가 명시하지 않는다
        #       (docs 는 "no default → 문자열은 ''" 만 규정한다).
        #       따라서 「default 를 지웠으니 비어 있을 것」이라고 가정하지 않는다.
        #
        #    ★ 대신 **어느 쪽이든 fail-closed 가 되는 배치**를 쓴다:
        #       첫 option 을 유효하지 않은 sentinel 로 둔다.
        #         · UI 가 첫 option 을 선택 → sentinel → ① 단계에서 거부
        #         · UI/API 가 빈 값 전달     → ""       → ① 단계에서 거부
        #         · API 가 아예 생략         → required:true → GitHub 이 거부
        #       세 경로 모두 **관측 코드에 도달하기 전에** 멈춘다.
        description: "관측 source — 반드시 fixture 또는 live 를 직접 고른다. live 는 CIO 가 명시 승인한 run 에서만."
        type: choice
        required: true
        options:
          - "__SELECT_SOURCE_EXPLICITLY__"
          - fixture
          - live
        default: "__SELECT_SOURCE_EXPLICITLY__"
      capture_max_filings:
        # ⛔ `type: number` 를 쓰지 않는다. Actions 는 number 를 실제로 검증하지 않고
        #    값은 어차피 문자열로 도착하며, default 생략 시 `0` 이 되어 「생략」과
        #    「명시적 0」을 구별할 수 없다. 빈 문자열이어야 그 둘이 구별된다.
        # ★ source=live 일 때만 의미가 있으므로 required 로 두지 않는다.
        description: "live discovery 조회 상한. source=live 일 때 **필수** · 양의 정수. source=fixture 에서는 쓰이지 않는다"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  observe-and-persist:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # ── ⓪ INPUT CONTRACT — 관측 코드에 닿기 전에 입력을 판정한다 ────
      #    ★★ H1. 이 단계가 통과하지 못하면 `mkdir` 조차 실행되지 않는다.
      #    ⛔ 어떤 값도 보정하지 않는다 — trim · 소문자화 · 기본값 대입 전부 하지 않는다.
      #       "Live" / " live" 를 관대하게 받아주면 「무엇으로 돌았는가」가 다시 흐려진다.
      - name: input contract (fail-closed)
        env:
          SOURCE: ${{ inputs.source }}
          CAPTURE_MAX_FILINGS: ${{ inputs.capture_max_filings }}
        run: |
          # ★ 빈 값과 공백을 로그에서 구별할 수 있게 raw 도 함께 남긴다.
          echo "raw: source=[$SOURCE] capture_max_filings=[$CAPTURE_MAX_FILINGS]"

          case "$SOURCE" in
            fixture|live)
              ;;
            "")
              echo "⛔ source 가 비어 있다 — 명시 선택 없이는 실행하지 않는다 (H1)"
              exit 1
              ;;
            *)
              echo "⛔ source 가 계약 밖의 값이다: [$SOURCE]"
              echo "   허용값은 fixture · live 두 개뿐이다. sentinel 을 고른 채 실행했거나"
              echo "   예상하지 않은 값이 전달됐다 — 어느 쪽이든 관측하지 않는다 (H1)"
              exit 1
              ;;
          esac

          if [ "$SOURCE" = "live" ]; then
            # ⛔ live 에서 limit 누락을 임의 기본값으로 메우지 않는다.
            case "$CAPTURE_MAX_FILINGS" in
              ""|*[!0-9]*)
                echo "⛔ source=live 인데 capture_max_filings 가 양의 정수가 아니다: [$CAPTURE_MAX_FILINGS]"
                exit 1
                ;;
            esac
            if [ "$CAPTURE_MAX_FILINGS" -lt 1 ]; then
              echo "⛔ capture_max_filings 는 1 이상이어야 한다: [$CAPTURE_MAX_FILINGS]"
              exit 1
            fi
            echo "✓ input contract · source=live · capture_max_filings=$CAPTURE_MAX_FILINGS"
          else
            # ★★ 모순된 입력은 처음부터 닫는다 (CIO 판정 2026-08-16 · Q5).
            #    fixture 경로는 capture_max_filings 를 쓰지 않는다. 값이 실려 오면
            #    실행자가 그것이 적용된다고 믿고 있다는 뜻이다 —
            #    ⛔ 로그로만 알리고 통과시키지 않는다. 「적용되지 않는 입력을 받아
            #       성공으로 끝내는 것」이 8/16 무효 run 의 형태 그 자체였다.
            if [ -n "$CAPTURE_MAX_FILINGS" ]; then
              echo "⛔ source=fixture 인데 capture_max_filings 가 전달됐다: [$CAPTURE_MAX_FILINGS]"
              echo "   이 경로에서는 적용되지 않는 값이다 — 모순된 입력이므로 실행하지 않는다."
              echo "   fixture 로 돌리려면 capture_max_filings 를 비워라 (Q5)"
              exit 1
            fi
            echo "✓ input contract · source=fixture"
          fi

      # ── ① OBSERVE — 저장소 밖으로만 emit 한다 ──────────────────────
      - name: observe
        env:
          EMIT_DIR: ${{ runner.temp }}/rule0022
          SOURCE: ${{ inputs.source }}
          CAPTURE_MAX_FILINGS: ${{ inputs.capture_max_filings }}
        run: |
          mkdir -p "$EMIT_DIR"
          # ★ 실제 전달값을 로그로 남긴다 — 무엇으로 돌았는지 사후에 확인 가능해야 한다.
          echo "SOURCE=$SOURCE"
          echo "CAPTURE_MAX_FILINGS=$CAPTURE_MAX_FILINGS"
          if [ "$SOURCE" = "live" ]; then
            # ⛔ live 는 manifest 를 쓰지 않는다 — fixture 로 내려가는 fallback 이 없다.
            python3 observation/observe_rule0022.py \
              --source live \
              --limit "$CAPTURE_MAX_FILINGS" \
              --out "$EMIT_DIR/emission.json"
          else
            python3 observation/observe_rule0022.py \
              --source fixture \
              --manifest collectors/fixtures/azure_cc_MANIFEST.json \
              --out "$EMIT_DIR/emission.json"
          fi

      # ── ② repository-clean guard — observe 가 저장소를 건드리지 않았는가 ──
      #    ★ 관측 실패 시 이 단계에 도달하지 않는다 (앞 단계가 non-zero 로 끝난다).
      - name: repository-clean guard
        run: |
          # ⛔ `git status --porcelain` 을 **로그로만** 남기지 않는다 — 판정에 쓴다.
          #    `git diff --exit-code` 는 untracked file 을 잡지 못하기 때문이다
          #    (CIO 판정 S4A.1 · REPOSITORY_CLEAN_GUARD_UNTRACKED_GAP).
          #    둘 다 두면 provenance 가 더 명확하다.
          git diff --exit-code
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "⛔ repository state 가 변경됐다 (tracked + untracked):"
            echo "$dirty"
            exit 1
          fi
          echo "✓ working tree clean (tracked + untracked)"

      # ── ②-b PARAMETER APPLICATION GUARD ───────────────────────────
      #    ★★ 「요청한 값」과 「실제로 적용된 값」은 다르다 —
      #       2026-08-16 첫 live 승인 run 이 정확히 이 지점에서 어긋났다
      #       (`RUN_PARAMETER_NOT_APPLIED`). 로그에 남기는 것만으로는 부족하고,
      #       산출물이 요청과 일치하는지를 **판정에 쓴다.**
      #    ⛔ 불일치를 보정하지 않는다 — 멈춘다.
      - name: parameter application guard
        env:
          EMIT_DIR: ${{ runner.temp }}/rule0022
          SOURCE: ${{ inputs.source }}
          CAPTURE_MAX_FILINGS: ${{ inputs.capture_max_filings }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          emit = json.load(open(os.path.join(os.environ["EMIT_DIR"], "emission.json"),
                                encoding="utf-8"))
          want = os.environ["SOURCE"]
          got = emit.get("source")
          meta = emit.get("meta") or {}
          bad = []
          if got != want:
              bad.append(f"요청 source={want!r} 인데 emit 된 source={got!r}")
          if want == "live":
              if "manifest" in meta:
                  bad.append(f"live 인데 meta 에 manifest 가 있다: {meta.get('manifest')!r}")
              limit = meta.get("limit")
              want_limit = int(os.environ["CAPTURE_MAX_FILINGS"])
              if limit != want_limit:
                  bad.append(f"요청 limit={want_limit} 인데 meta.limit={limit!r}")
          else:
              if "manifest" not in meta:
                  bad.append("fixture 인데 meta 에 manifest 가 없다")
          if bad:
              print("⛔ 요청 parameter 가 산출물에 적용되지 않았다:")
              for b in bad:
                  print(f"   · {b}")
              sys.exit(1)
          print(f"✓ parameter 적용 확인 · source={got} · meta={meta}")
          PY

      # ── ③ emitted record validation — persist 전에 계약을 먼저 건다 ──
      #    ⛔ 실패하면 persist 하지 않는다.
      - name: emitted record validation
        env:
          EMIT_DIR: ${{ runner.temp }}/rule0022
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "observation")
          from record import validate_record, RecordInvariantError
          em = json.load(open(os.path.join(os.environ["EMIT_DIR"], "emission.json"), encoding="utf-8"))
          assert em["schema_version"] == "observation_emission/1", em["schema_version"]
          if not em["records"]:
              print("✗ emit 된 record 가 0건 — persist 하지 않는다"); sys.exit(1)
          for r in em["records"]:
              validate_record(r)          # ⛔ 하나라도 실패하면 여기서 멈춘다
          print(f"✓ emitted record {len(em['records'])}건 전부 계약 통과")
          PY

      # ── ④ PERSIST — 직렬화된 record 를 다시 읽어 Store 에 적용한다 ──
      - name: persist
        env:
          EMIT_DIR: ${{ runner.temp }}/rule0022
        run: |
          python3 observation/persist_rule0022.py \
            --emission "$EMIT_DIR/emission.json" \
            --store    "$EMIT_DIR/store.json" \
            --result   "$EMIT_DIR/persist_result.json"

      # ── ⑤ resulting store validation ──────────────────────────────
      #    ⛔ 미해소 CONFLICT/REVISION 이 있으면 여기서 non-zero 로 끝난다.
      - name: resulting store validation
        env:
          EMIT_DIR: ${{ runner.temp }}/rule0022
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "observation")
          import store as ST
          from record import validate_record
          d = os.environ["EMIT_DIR"]
          st = ST.load_state(os.path.join(d, "store.json"))
          res = json.load(open(os.path.join(d, "persist_result.json"), encoding="utf-8"))
          for e in st["series"].values():
              for rev in e["revisions"]:
                  validate_record(rev["record"])
          blocked = ST.blocked_keys(st)
          print(f"series {len(st['series'])} · consumable {len(ST.consumable_keys(st))} · blocked {len(blocked)}")
          if blocked or res["unresolved"]:
              print(f"⛔ 미해소 CONFLICT/REVISION — 정상 success 로 소비하지 않는다: {blocked}")
              sys.exit(1)
          if ST.digest(st) != res["store_digest"]:
              print("⛔ persist 결과의 store digest 가 저장된 state 와 다르다"); sys.exit(1)
          print("✓ store 계약 통과")
          PY

      # ── ⑥ 저장소 불변 재확인 — persist 도 repo 를 건드리지 않았다 ──
      - name: repository-clean guard (post-persist)
        run: |
          # ★ observe 직후 guard 와 **동일한 계약**이다 (S4A.1).
          git diff --exit-code
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "⛔ repository state 가 변경됐다 (tracked + untracked):"
            echo "$dirty"
            exit 1
          fi
          echo "✓ working tree clean (tracked + untracked)"

      # ── ⑦ artifact upload ─────────────────────────────────────────
      - name: artifact upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rule0022-observation
          path: ${{ runner.temp }}/rule0022
          if-no-files-found: error
