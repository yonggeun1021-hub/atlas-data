name: P9-06 Upbit Realtime WebSocket Bounded Capture

on:
  schedule:
    - cron: "6,36 * * * *"  # every 30 minutes; phase-target a natural 15m boundary within the bounded window
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Bounded WebSocket capture duration (seconds)"
        required: false
        default: "240"
      validation_duration_seconds:
        description: "Public transport validation-only capture duration (seconds)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: atlas-upbit-realtime-bounded-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # Was 10; the job has been observed exceeding it since 2026-09-18 (e.g.
    # 02:06:13 -> 02:17:18Z, 11m05s). A timed-out job is marked cancelled,
    # which silently skips every not-cancelled-guarded step below (rule
    # lineage sidecar, axis bridge, bridge explanation, funnel briefing,
    # candidate detail, capture-to-decision timing guard) even though the
    # decision packet itself (its own step runs unconditionally) still
    # commits -- see docs/do_not_touch_and_why.md section 3. This literal key
    # and its integer value carry none of the tokens that section's
    # dispatcher-pin fingerprint regex matches, so raising it is a byte-drift
    # (compatible) change, not a fingerprint-changing (blocking) one -- change
    # verified by recomputing that regex over this file before and after.
    # 20m keeps a wide margin under the 30-minute schedule interval.
    timeout-minutes: 20
    steps:
      - name: Capture Upbit realtime runner start time
        id: runner_start
        run: echo "observed_started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Consumers below never read git history (no git log/show/blame/
      # merge-base); the commit+push step only needs HEAD, so a shallow
      # checkout is sufficient and avoids re-cloning 3500+ commits daily.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install P9-06 realtime capture dependency (websockets)
        run: pip install "websockets>=12.0"
      - name: Offline P9-06 realtime-gate regression (no live connection)
        run: |
          python3 test/upbit_realtime_recovery_tests.py
          python3 test/test_upbit_realtime_gate.py
          python3 test/test_upbit_public_validation_capture.py
          python3 test/test_upbit_public_validation_natural_20260829.py
      - name: Offline crypto PAPER decision snapshot regression (P1-CR-08 + P5-08 + P5-09 composition)
        run: python3 test/test_crypto_paper_decision_snapshot.py
      - name: Offline P5-10 Crypto five-axis entry and exit bridge regression
        run: python3 test/test_crypto_axis_trade_bridge.py
      - name: Offline P5-10 Crypto five-axis bridge state explanation regression
        run: python3 test/test_crypto_axis_trade_bridge_explanation.py
      - name: Offline P1-CR-08 hash-bound live component registry regression
        run: python3 test/test_crypto_live_component_registry.py
      - name: Offline P8-16 Crypto funnel briefing regression
        run: python3 test/test_crypto_funnel_briefing.py
      - name: Find latest committed P3-12 tradeable-universe classification
        id: universe
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_upbit_p3_p4_lineage.py \
            --latest-data-root data/observations/upbit_tradeable_universe \
            --select-only \
            --github-output "$GITHUB_OUTPUT"
      # Public market-data WebSocket only -- ticker/trade/orderbook/candle.*.
      # No API key/secret, never myOrder/myAsset, never an order/withdrawal/
      # private endpoint. See config/upbit_realtime_gate_contract.json and
      # realtime/upbit_realtime_gate.py::PRIVATE_WS_TYPES_FORBIDDEN /
      # build_subscription_message (fails closed on any private channel).
      # Subscription = every admitted P3-12 market (TRADEABLE_UNIVERSE and
      # PAPER_ELIGIBLE), independent of the liquidity floor and of holdings
      # (CIO addendum CIO-ADDENDUM-CRYPTO-SUBSCRIPTION-SCOPE-NO-HOLDINGS-LEAK-
      # 20260914). The ratified 30-day floor is a per-market decision cap only.
      - name: Bounded-duration public WebSocket capture
        id: capture
        env:
          DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '240' }}
        run: |
          set -euo pipefail
          SNAPSHOT_DATE=$(date -u +%F)
          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"
          UNIVERSE_ARG=()
          if [ -n "${{ steps.universe.outputs.packet_path }}" ]; then
            UNIVERSE_ARG=(--universe-packet "${{ steps.universe.outputs.packet_path }}")
          fi
          python3 .github/scripts/upbit_realtime_capture.py \
            --evidence-root evidence/crypto/upbit/realtime \
            --snapshot-date "$SNAPSHOT_DATE" \
            --duration-seconds "$DURATION_SECONDS" \
            "${UNIVERSE_ARG[@]}"
          echo "result=captured" >> "$GITHUB_OUTPUT"
      # P1-CR-08 (Regime) + P5-08 (Candidate Promotion) + P5-09 (PAPER Buy
      # Eligibility) composition, tacked onto this existing 30-minute job --
      # NOT a new schedule.  It must run IMMEDIATELY after the realtime
      # capture step: the ratified CRYPTO freshness policy is re-evaluated at
      # this step's generated_at, so any step in between adds its duration to
      # every ticker's provider age (see the capture-to-decision guard below).
      # Pure read-only derivation over already-committed evidence (this run's
      # just-captured P9-06 evidence included); zero network/order calls -- see
      # decision/crypto_paper_decision_snapshot.py's own module docstring
      # for the full scope boundary (Continuous Briefing/alerting stays
      # UNDEFINED/out of scope). Runs unconditionally, but writes no decision
      # generation until universe, market-evidence and this run's realtime
      # capture share the scheduler's UTC date. Before then it reports the
      # explicit WAIT / NOT_EVALUATED state and retains the prior actual
      # evaluation reference for telemetry.
      - name: Crypto PAPER decision snapshot (P1-CR-08 + P5-08 + P5-09 composition, read-only)
        id: crypto_paper_decision
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          OBSERVED_STARTED_AT_UTC: ${{ steps.runner_start.outputs.observed_started_at_utc }}
        run: |
          set -euo pipefail
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          EXPECTED_VINTAGE_DATE="${GENERATED_AT:0:10}"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          ARGS=(
            --generated-at "$GENERATED_AT"
            --source-commit "$SOURCE_COMMIT"
            --expected-vintage-date "$EXPECTED_VINTAGE_DATE"
          )
          if [ -n "${OBSERVED_STARTED_AT_UTC:-}" ]; then
            ARGS+=(--started-at "$OBSERVED_STARTED_AT_UTC")
          fi
          echo "generated_at=$GENERATED_AT" >> "$GITHUB_OUTPUT"
          if [ "$CAPTURE_RESULT" = "captured" ] && [ -n "$SNAPSHOT_DATE" ]; then
            RUN_PATH=$(ls -1 "evidence/crypto/upbit/realtime/$SNAPSHOT_DATE"/run_*.json 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$RUN_PATH" ]; then
              ARGS+=(--realtime-run-path "$RUN_PATH")
              echo "realtime_run_path=$RUN_PATH" >> "$GITHUB_OUTPUT"
            fi
          fi
          python3 decision/crypto_paper_decision_snapshot.py \
            --wire-regime-components \
            "${ARGS[@]}"
      # P5-10 consumes only the exact decision packet above. It adds no
      # threshold or aggregate Regime interpretation: missing axes or the
      # unratified aggregate policy cap entry at WAIT, while P7-13 hard-exit
      # priority is preserved verbatim. No private position/account bytes or
      # order endpoint are read.
      - name: P5-10 Crypto five-axis per-symbol entry and exit bridge (read-only)
        id: crypto_axis_trade_bridge
        if: steps.crypto_paper_decision.outcome == 'success' && steps.crypto_paper_decision.outputs.evaluation_status == 'EVALUATED'
        env:
          DECISION_PATH: ${{ steps.crypto_paper_decision.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$DECISION_PATH"
          python3 decision/crypto_axis_trade_bridge.py --decision-packet "$DECISION_PATH"
      # Read-only explanation of the exact bridge packet produced immediately
      # above -- it consumes only that step's own output path and derives no
      # new state, threshold, aggregate Regime reading or authority. It runs
      # only when the producer succeeded; a missing path fails the step rather
      # than falling back to another generation or an empty explanation.
      - name: P5-10 Crypto five-axis bridge state explanation (read-only)
        id: crypto_axis_trade_bridge_explanation
        if: steps.crypto_axis_trade_bridge.outcome == 'success'
        env:
          BRIDGE_PATH: ${{ steps.crypto_axis_trade_bridge.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_PATH"
          python3 decision/crypto_axis_trade_bridge_explanation.py \
            --bridge-packet "$BRIDGE_PATH" \
            --output-root evidence/crypto_axis_trade_bridge_explanation
      # P8-16 consumes only the exact decision packet created immediately
      # above. It performs no fallback, network call, threshold evaluation,
      # candidate promotion, PAPER execution, or private-ledger read.
      - name: P8-16 Crypto funnel and PAPER decision briefing (read-only)
        id: crypto_funnel_briefing
        if: steps.crypto_paper_decision.outcome == 'success' && steps.crypto_paper_decision.outputs.evaluation_status == 'EVALUATED'
        env:
          DECISION_PATH: ${{ steps.crypto_paper_decision.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$DECISION_PATH"
          python3 briefing/crypto_funnel_briefing.py --decision-packet "$DECISION_PATH"
      - name: Crypto candidate detail projection (read-only)
        id: crypto_candidate_detail
        if: steps.crypto_paper_decision.outcome == 'success' && steps.crypto_paper_decision.outputs.evaluation_status == 'EVALUATED'
        env:
          DECISION_PATH: ${{ steps.crypto_paper_decision.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$DECISION_PATH"
          python3 decision/crypto_candidate_detail_view.py \
            --decision-packet "$DECISION_PATH" \
            --output-root evidence/crypto_candidate_detail
      # Scheduler-ordering regression guard.  Measures the decision's
      # generated_at minus the consumed realtime run's status.generated_at and
      # fails this step when it exceeds the ENGINEERING budget in
      # .github/scripts/check_crypto_decision_capture_gap.py (5s; expected
      # 0-1s).  That budget is not a freshness policy: it never changes the
      # ratified 20s/3s CRYPTO limits or any decision outcome.  Placed after
      # the read-only consumers so a failure never suppresses them; telemetry
      # and the evidence commit still run.
      - name: Crypto capture-to-decision timing guard (engineering budget, read-only)
        id: crypto_decision_capture_gap
        if: ${{ !cancelled() && steps.crypto_paper_decision.outputs.realtime_run_path != '' }}
        env:
          REALTIME_RUN_PATH: ${{ steps.crypto_paper_decision.outputs.realtime_run_path }}
          DECISION_GENERATED_AT: ${{ steps.crypto_paper_decision.outputs.generated_at }}
          DECISION_PACKET_PATH: ${{ steps.crypto_paper_decision.outputs.path }}
        run: |
          set -euo pipefail
          ARGS=(--realtime-run-path "$REALTIME_RUN_PATH" --decision-generated-at "$DECISION_GENERATED_AT")
          if [ -n "${DECISION_PACKET_PATH:-}" ]; then
            ARGS+=(--decision-packet "$DECISION_PACKET_PATH")
          fi
          python3 .github/scripts/check_crypto_decision_capture_gap.py "${ARGS[@]}"
      # Observation-only reference markets prove the public ticker/trade/
      # orderbook/candle transport even while P3-12 has zero approved
      # subscription markets.  This separate root is never passed to the
      # P3/P5/P8 decision chain and carries zero strategy/order authority.
      # It runs AFTER the decision chain: its ~30s window used to sit between
      # the realtime capture and the decision step, so the decision (which
      # re-evaluates the ratified CRYPTO freshness policy at its own
      # generated_at) always saw every ticker >= 30s old.  It still runs
      # exactly when the realtime capture succeeded, independent of the
      # decision chain's own outcome.
      - name: Public WebSocket natural transport validation (decision-isolated)
        id: validation_capture
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        env:
          DURATION_SECONDS: ${{ github.event.inputs.validation_duration_seconds || '30' }}
        run: |
          set -euo pipefail
          SNAPSHOT_DATE=$(date -u +%F)
          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/upbit_realtime_capture.py \
            --evidence-root evidence/crypto/upbit/realtime_validation \
            --validation-anchor-contract config/upbit_public_validation_anchor_contract.json \
            --snapshot-date "$SNAPSHOT_DATE" \
            --duration-seconds "$DURATION_SECONDS"
          echo "result=captured" >> "$GITHUB_OUTPUT"
      - name: Record P9-06 realtime scheduler telemetry
        if: always()
        env:
          ATLAS_EVENT_NAME: ${{ github.event_name }}
          ATLAS_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ATLAS_RUN_ID: ${{ github.run_id }}
          ATLAS_RUN_ATTEMPT: ${{ github.run_attempt }}
          ATLAS_RUNNER_STARTED_AT_UTC: ${{ steps.runner_start.outputs.observed_started_at_utc }}
          ATLAS_CAPTURE_STEP_OUTCOME: ${{ steps.capture.outcome }}
          ATLAS_CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          ATLAS_VALIDATION_CAPTURE_STEP_OUTCOME: ${{ steps.validation_capture.outcome }}
          ATLAS_VALIDATION_CAPTURE_RESULT: ${{ steps.validation_capture.outputs.result }}
          ATLAS_CRYPTO_PAPER_DECISION_STEP_OUTCOME: ${{ steps.crypto_paper_decision.outcome }}
          ATLAS_CRYPTO_PAPER_DECISION_OUTCOME: ${{ steps.crypto_paper_decision.outputs.outcome }}
          ATLAS_CRYPTO_PAPER_DECISION_EVALUATION_STATUS: ${{ steps.crypto_paper_decision.outputs.evaluation_status }}
          ATLAS_CRYPTO_PAPER_DECISION_STATE: ${{ steps.crypto_paper_decision.outputs.decision_state }}
          ATLAS_CRYPTO_PAPER_DECISION_REASON: ${{ steps.crypto_paper_decision.outputs.reason }}
          ATLAS_CRYPTO_PAPER_DECISION_PATH: ${{ steps.crypto_paper_decision.outputs.path }}
          ATLAS_CRYPTO_PAPER_DECISION_GENERATION_ID: ${{ steps.crypto_paper_decision.outputs.generation_id }}
          ATLAS_CRYPTO_PAPER_DECISION_SHA256: ${{ steps.crypto_paper_decision.outputs.payload_sha256 }}
          ATLAS_CRYPTO_PAPER_DECISION_LAST_EVALUATED_GENERATION_ID: ${{ steps.crypto_paper_decision.outputs.last_evaluated_generation_id }}
          ATLAS_CRYPTO_PAPER_DECISION_LAST_EVALUATED_SHA256: ${{ steps.crypto_paper_decision.outputs.last_evaluated_payload_sha256 }}
          ATLAS_CRYPTO_AXIS_TRADE_BRIDGE_STEP_OUTCOME: ${{ steps.crypto_axis_trade_bridge.outcome }}
          ATLAS_CRYPTO_AXIS_TRADE_BRIDGE_OUTCOME: ${{ steps.crypto_axis_trade_bridge.outputs.outcome }}
          ATLAS_CRYPTO_AXIS_TRADE_BRIDGE_PATH: ${{ steps.crypto_axis_trade_bridge.outputs.path }}
          ATLAS_CRYPTO_AXIS_TRADE_BRIDGE_SOURCE_GENERATION_ID: ${{ steps.crypto_axis_trade_bridge.outputs.source_generation_id }}
          ATLAS_CRYPTO_AXIS_TRADE_BRIDGE_SHA256: ${{ steps.crypto_axis_trade_bridge.outputs.packet_sha256 }}
          ATLAS_CRYPTO_FUNNEL_BRIEFING_STEP_OUTCOME: ${{ steps.crypto_funnel_briefing.outcome }}
          ATLAS_CRYPTO_FUNNEL_BRIEFING_OUTCOME: ${{ steps.crypto_funnel_briefing.outputs.outcome }}
          ATLAS_CRYPTO_FUNNEL_BRIEFING_PATH: ${{ steps.crypto_funnel_briefing.outputs.path }}
          ATLAS_CRYPTO_FUNNEL_BRIEFING_GENERATION_ID: ${{ steps.crypto_funnel_briefing.outputs.generation_id }}
          ATLAS_CRYPTO_FUNNEL_BRIEFING_SHA256: ${{ steps.crypto_funnel_briefing.outputs.packet_sha256 }}
          ATLAS_CRYPTO_CANDIDATE_DETAIL_STEP_OUTCOME: ${{ steps.crypto_candidate_detail.outcome }}
          ATLAS_CRYPTO_DECISION_CAPTURE_GAP_STEP_OUTCOME: ${{ steps.crypto_decision_capture_gap.outcome }}
          ATLAS_CRYPTO_DECISION_CAPTURE_GAP_STATUS: ${{ steps.crypto_decision_capture_gap.outputs.status }}
          ATLAS_CRYPTO_DECISION_CAPTURE_GAP_SECONDS: ${{ steps.crypto_decision_capture_gap.outputs.gap_seconds }}
          ATLAS_CRYPTO_DECISION_CAPTURE_GAP_ENGINEERING_BUDGET_SECONDS: ${{ steps.crypto_decision_capture_gap.outputs.engineering_budget_seconds }}
          ATLAS_REPOSITORY: ${{ github.repository }}
          ATLAS_SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p data/operations/upbit_realtime_capture_runs
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {k: os.environ.get(k) for k in os.environ if k.startswith("ATLAS_")}
          out = Path("data/operations/upbit_realtime_capture_runs")
          out.mkdir(parents=True, exist_ok=True)
          run_id = record.get("ATLAS_RUN_ID", "unknown")
          attempt = record.get("ATLAS_RUN_ATTEMPT", "1")
          (out / f"{run_id}-{attempt}.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      # Additive rule-lineage sidecar (config/rule_registry_v1.json ids) for the
      # exact decision packet above, keyed by its payload_sha256. It reads that
      # packet only, never edits it or the producer, and never exits non-zero
      # for a lineage problem (a failure prints a ::warning:: annotation);
      # continue-on-error and the timeout keep the evidence commit.
      - name: Rule lineage sidecar for the Crypto PAPER decision packet (read-only)
        id: crypto_rule_lineage
        if: ${{ !cancelled() && steps.crypto_paper_decision.outcome == 'success' && steps.crypto_paper_decision.outputs.evaluation_status == 'EVALUATED' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          DECISION_PATH: ${{ steps.crypto_paper_decision.outputs.path }}
        run: python3 governance/rule_lineage_producers.py crypto-decision --packet "$DECISION_PATH"
      - name: Commit append-only realtime evidence and run telemetry
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          VALIDATION_CAPTURE_RESULT: ${{ steps.validation_capture.outputs.result }}
          VALIDATION_SNAPSHOT_DATE: ${{ steps.validation_capture.outputs.snapshot_date }}
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operations/upbit_realtime_capture_runs || true
          if [ "$CAPTURE_RESULT" = "captured" ] && [ -n "$SNAPSHOT_DATE" ]; then
            git add "evidence/crypto/upbit/realtime/$SNAPSHOT_DATE"
          fi
          if [ "$VALIDATION_CAPTURE_RESULT" = "captured" ] && [ -n "$VALIDATION_SNAPSHOT_DATE" ]; then
            git add "evidence/crypto/upbit/realtime_validation/$VALIDATION_SNAPSHOT_DATE"
          fi
          # Crypto PAPER decision snapshot (P1-CR-08 + P5-08 + P5-09) --
          # new, separate evidence path; committed in the same run/commit as
          # the realtime evidence above, never reusing an existing path.
          git add evidence/crypto_paper_decision || true
          # Additive rule-lineage sidecar of that decision packet.
          git add evidence/rule_lineage/crypto_paper_decision || true
          # P5-10 read-only, per-symbol five-axis entry/exit policy bridge.
          # It contains no private position/account bytes and no authority.
          git add evidence/crypto_axis_trade_bridge || true
          # Same-generation read-only explanation of that bridge packet; it is
          # absent whenever the producer or explanation step did not run, which
          # this staging convention tolerates without masking step failure.
          git add evidence/crypto_axis_trade_bridge_explanation || true
          # P8-16 is the read-only API/briefing projection of that exact
          # decision generation. Private P10/P7 state is never copied here.
          git add evidence/crypto_funnel_briefing || true
          git add evidence/crypto_candidate_detail || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "upbit realtime bounded capture ${SNAPSHOT_DATE:-unknown} [${TRIGGER}]"
            bash .github/scripts/push_to_default_branch.sh "$DEFAULT_BRANCH"
          fi
