name: P1-CR-06 Crypto Breadth Daily Capture

on:
  schedule:
    - cron: "40 0 * * *"  # 00:40 UTC; prior UTC close finalized
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-crypto-breadth-daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Offline Crypto breadth regression
        run: python3 test/test_crypto_breadth.py
      - name: Capture complete append-only Kraken USD universe
        id: capture
        run: |
          set -euo pipefail
          SNAPSHOT_DATE=$(date -u +%F)
          SNAPSHOT="evidence/crypto/breadth/raw/$SNAPSHOT_DATE"
          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"
          if [ -f "$SNAPSHOT/_manifest.json" ]; then
            echo "이미 $SNAPSHOT_DATE Crypto breadth snapshot이 있습니다."
            echo "result=skipped_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -e "$SNAPSHOT" ]; then
            echo "불완전한 기존 경로가 있어 덮어쓰지 않습니다: $SNAPSHOT" >&2
            exit 1
          fi
          python3 .github/scripts/crypto_breadth_capture.py \
            --snapshot-root evidence/crypto/breadth/raw \
            --request-interval-seconds 1.05
          python3 .github/scripts/crypto_breadth.py transform "$SNAPSHOT" \
            --out "$RUNNER_TEMP/crypto_breadth.json"
          python3 - "$RUNNER_TEMP/crypto_breadth.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          universe = value["universe"]
          print(json.dumps({
              "status": value["status"],
              "unknown_reason": value["unknown_reason"],
              "ranked_candidate_count": universe["ranked_candidate_count"],
              "selected_asset_count": universe["selected_asset_count"],
              "observed_asset_count": universe["observed_asset_count"],
              "observation_coverage_bps": universe["observation_coverage_bps"],
              "taxonomy_unknown_before_cutoff": universe[
                  "taxonomy_unknown_before_cutoff"
              ],
          }, ensure_ascii=False, indent=2))
          PY
          echo "result=captured" >> "$GITHUB_OUTPUT"
      - name: Commit immutable raw snapshot
        if: steps.capture.outputs.result == 'captured'
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/crypto/breadth/raw/$SNAPSHOT_DATE"
          git commit -m "crypto breadth raw snapshot $SNAPSHOT_DATE"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
