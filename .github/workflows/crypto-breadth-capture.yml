name: P1-CR-06 Crypto Breadth Daily Capture

on:
  schedule:
    - cron: "40 0 * * *"  # 00:40 UTC; prior UTC close finalized
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-crypto-breadth-daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Capture Crypto Breadth runner start time
        id: runner_start
        run: echo "observed_started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Offline Crypto breadth regression
        run: python3 test/test_crypto_breadth.py
      - name: Capture complete append-only Kraken USD universe
        id: capture
        run: |
          set -euo pipefail
          SNAPSHOT_DATE=$(date -u +%F)
          SNAPSHOT="evidence/crypto/breadth/raw/$SNAPSHOT_DATE"
          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"
          if [ -f "$SNAPSHOT/_manifest.json" ]; then
            echo "이미 $SNAPSHOT_DATE Crypto breadth snapshot이 있습니다."
            echo "result=skipped_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -e "$SNAPSHOT" ]; then
            echo "불완전한 기존 경로가 있어 덮어쓰지 않습니다: $SNAPSHOT" >&2
            echo "result=incomplete_existing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          python3 .github/scripts/crypto_breadth_capture.py \
            --snapshot-root evidence/crypto/breadth/raw \
            --request-interval-seconds 1.05
          python3 .github/scripts/crypto_breadth.py transform "$SNAPSHOT" \
            --out "$RUNNER_TEMP/crypto_breadth.json"
          python3 - "$RUNNER_TEMP/crypto_breadth.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          universe = value["universe"]
          print(json.dumps({
              "status": value["status"],
              "unknown_reason": value["unknown_reason"],
              "ranked_candidate_count": universe["ranked_candidate_count"],
              "selected_asset_count": universe["selected_asset_count"],
              "observed_asset_count": universe["observed_asset_count"],
              "observation_coverage_bps": universe["observation_coverage_bps"],
              "taxonomy_unknown_before_cutoff": universe[
                  "taxonomy_unknown_before_cutoff"
              ],
          }, ensure_ascii=False, indent=2))
          PY
          echo "result=captured" >> "$GITHUB_OUTPUT"
      - name: P1-CR-06 immutable snapshot validation
        id: breadth_validation
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
        run: |
          python3 .github/scripts/crypto_breadth.py transform \
            "evidence/crypto/breadth/raw/$SNAPSHOT_DATE" \
            --out "$RUNNER_TEMP/crypto-breadth-live-transform.json"
      - name: Upload P1-CR-06 live transform evidence
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: p1-cr-06-live-transform-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crypto-breadth-live-transform.json
          if-no-files-found: error
      - name: Build current Crypto 7d/30d user reference
        id: recent_reference
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
        run: |
          set -euo pipefail
          OUTPUT="data/observations/crypto_recent_reference/$SNAPSHOT_DATE/packet.json"
          python3 .github/scripts/crypto_recent_reference.py \
            "evidence/crypto/breadth/raw/$SNAPSHOT_DATE" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-commit "$(git rev-parse HEAD)" \
            --out "$OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
      # Previously this step's build only ever wrote to $RUNNER_TEMP (never
      # committed, only ever reachable as a short-lived CI artifact) -- so
      # decision/crypto_paper_decision_snapshot.py could never read it back
      # and always fed the P5-08 promotion builder a hardcoded
      # leadership_output=None. This step now additionally persists the
      # exact same build_transform() output to the committed
      # data/observations/crypto_leadership/<AS_OF_DATE>/packet.json path --
      # the same "data/observations/<name>/<date>/packet.json" convention
      # already used immediately above by data/observations/
      # crypto_recent_reference -- so it becomes real, committed, natural
      # evidence a consumer can read.
      - name: P1-CR-07 leadership packet build + persist
        id: leadership_validation
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
        run: |
          set -euo pipefail
          AS_OF_DATE=$(python3 -c 'import datetime as d,sys; print((d.date.fromisoformat(sys.argv[1])-d.timedelta(days=1)).isoformat())' "$SNAPSHOT_DATE")
          OUTPUT="data/observations/crypto_leadership/$AS_OF_DATE/packet.json"
          python3 .github/scripts/crypto_leadership.py transform \
            evidence/crypto/breadth/raw \
            --end-date "$AS_OF_DATE" \
            --out "$OUTPUT"
          cp "$OUTPUT" "$RUNNER_TEMP/crypto-leadership-live-replay.json"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "as_of_date=$AS_OF_DATE" >> "$GITHUB_OUTPUT"
      # P2-04 reuses the same committed/as-captured CR-06 archive and the
      # canonical CR-07 builder.  It prepares only the adjacent Leadership
      # source pair consumed by rotation/crypto_rotation.py.  The repository
      # has no default rotation policy, so this step never ranks buckets or
      # creates a P2 state; insufficient history is an expected BLOCKED result.
      - name: Populate P2-04 Crypto Rotation source pair
        id: p2_04_source_pair
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        run: python3 .github/scripts/crypto_rotation_source_pair_populate.py
      # P3-04 reuses universe/crypto_global_universe.py's own build_packet()
      # unchanged -- no new endpoint, no new cron. A taxonomy/full-coverage
      # gap is a known, expected, deterministic BLOCKED outcome, not a
      # failure: this step never fails the job for that reason, it only
      # records the reason for telemetry below. It only reads the raw
      # snapshot above and writes a local file; the raw snapshot itself is
      # never touched, and its own commit (below) is separate from raw's.
      - name: Populate P3-04 Crypto source-coverage packet
        id: p3_04_population
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
        run: |
          python3 .github/scripts/crypto_forward_universe_populate.py "$SNAPSHOT_DATE"
      # The source-coverage packet above correctly remains BLOCKED while the
      # taxonomy is incomplete. This separate diagnostic preserves the exact
      # cutoff-relevant review population without classifying or ratifying it.
      - name: Populate P3-04 taxonomy review inventory
        id: p3_04_taxonomy_gap
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
        run: python3 .github/scripts/crypto_taxonomy_gap_inventory.py "$SNAPSHOT_DATE"
      - name: Record Crypto Breadth scheduler telemetry
        if: always()
        env:
          ATLAS_EVENT_NAME: ${{ github.event_name }}
          ATLAS_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ATLAS_RUN_ID: ${{ github.run_id }}
          ATLAS_RUN_ATTEMPT: ${{ github.run_attempt }}
          ATLAS_RUNNER_STARTED_AT_UTC: ${{ steps.runner_start.outputs.observed_started_at_utc }}
          ATLAS_CAPTURE_STEP_OUTCOME: ${{ steps.capture.outcome }}
          ATLAS_CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          ATLAS_BREADTH_VALIDATION_OUTCOME: ${{ steps.breadth_validation.outcome }}
          ATLAS_LEADERSHIP_VALIDATION_OUTCOME: ${{ steps.leadership_validation.outcome }}
          ATLAS_P2_04_STEP_OUTCOME: ${{ steps.p2_04_source_pair.outcome }}
          ATLAS_P2_04_RESULT: ${{ steps.p2_04_source_pair.outputs.outcome }}
          ATLAS_P2_04_REASON: ${{ steps.p2_04_source_pair.outputs.reason }}
          ATLAS_P2_04_PATH: ${{ steps.p2_04_source_pair.outputs.path }}
          ATLAS_P2_04_SHA256: ${{ steps.p2_04_source_pair.outputs.payload_sha256 }}
          ATLAS_P3_04_STEP_OUTCOME: ${{ steps.p3_04_population.outcome }}
          ATLAS_P3_04_RESULT: ${{ steps.p3_04_population.outputs.outcome }}
          ATLAS_P3_04_REASON: ${{ steps.p3_04_population.outputs.reason }}
          ATLAS_P3_04_PATH: ${{ steps.p3_04_population.outputs.path }}
          ATLAS_P3_04_SHA256: ${{ steps.p3_04_population.outputs.payload_sha256 }}
          ATLAS_REPOSITORY: ${{ github.repository }}
          ATLAS_SERVER_URL: ${{ github.server_url }}
        run: python3 .github/scripts/record_crypto_breadth_run.py
      - name: Commit immutable raw snapshot and run telemetry
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          LEADERSHIP_AS_OF_DATE: ${{ steps.leadership_validation.outputs.as_of_date }}
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operations/crypto_breadth_capture_runs || true
          if [ "$CAPTURE_RESULT" = "captured" ]; then
            git add "evidence/crypto/breadth/raw/$SNAPSHOT_DATE"
          fi
          if [ -n "$SNAPSHOT_DATE" ] && [ -d "data/observations/crypto_recent_reference/$SNAPSHOT_DATE" ]; then
            git add "data/observations/crypto_recent_reference/$SNAPSHOT_DATE"
          fi
          if [ -n "$LEADERSHIP_AS_OF_DATE" ] && [ -d "data/observations/crypto_leadership/$LEADERSHIP_AS_OF_DATE" ]; then
            git add "data/observations/crypto_leadership/$LEADERSHIP_AS_OF_DATE"
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "crypto breadth capture ${SNAPSHOT_DATE:-unknown} [${TRIGGER}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      # Like P3-04, the derived P2-04 source pair is committed only after raw
      # evidence is safely pushed.  A blocked/failed pair can never roll back
      # or prevent raw capture publication.
      - name: Commit P2-04 Crypto Rotation source pair
        if: always()
        env:
          PAIR_DATE: ${{ steps.p2_04_source_pair.outputs.as_of_date }}
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$PAIR_DATE" ] && [ -d "data/observations/crypto_rotation_source_pair/$PAIR_DATE" ]; then
            git add "data/observations/crypto_rotation_source_pair/$PAIR_DATE"
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "crypto rotation source pair ${PAIR_DATE:-unknown} [${TRIGGER}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      # Deliberately its own step and commit, after raw evidence above is
      # already pushed -- a P3-04 population failure or a BLOCKED outcome
      # can never lose or roll back the already-committed raw snapshot.
      - name: Commit P3-04 source-coverage population
        if: always()
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$SNAPSHOT_DATE" ] && [ -d "data/observations/crypto_global_universe/$SNAPSHOT_DATE" ]; then
            git add "data/observations/crypto_global_universe/$SNAPSHOT_DATE"
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "crypto global universe population ${SNAPSHOT_DATE:-unknown} [${TRIGGER}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Commit P3-04 taxonomy review inventory
        if: always()
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$SNAPSHOT_DATE" ] && [ -d "data/observations/crypto_taxonomy_gap/$SNAPSHOT_DATE" ]; then
            git add "data/observations/crypto_taxonomy_gap/$SNAPSHOT_DATE"
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "crypto taxonomy review inventory ${SNAPSHOT_DATE:-unknown} [${TRIGGER}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Upload P1-CR-07 live replay evidence
        if: >-
          always() && (steps.capture.outputs.result == 'captured' ||
          steps.capture.outputs.result == 'skipped_existing')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: p1-cr-07-live-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crypto-leadership-live-replay.json
          if-no-files-found: error
