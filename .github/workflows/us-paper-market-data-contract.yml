name: US PAPER Market Data Contract

on:
  pull_request:
    paths:
      - "config/us_*"
      - "universe/us_*"
      - "market_data/us_*"
      - "docs/us_*"
      - "validation/tests/test_us_*"
      - ".github/workflows/us-paper-market-data-contract.yml"
  push:
    branches: [main]
    paths:
      - "config/us_*"
      - "universe/us_*"
      - "market_data/us_*"
      - "docs/us_*"
      - "validation/tests/test_us_*"
      - ".github/workflows/us-paper-market-data-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only checkout without changing common action-count contract
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: US universe and completed-bar regressions
        run: |
          python3 validation/tests/test_us_investable_registry.py
          python3 validation/tests/test_us_session_bars.py
          python3 validation/tests/test_us_paper_market_data_boundary.py
      - name: Verify no tracked mutation
        run: git diff --exit-code

  regression-shard-1:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read-only checkout without changing common action-count contract
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Match the authoritative gate Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install existing CI dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Re-run US boundary then approved regression shard 1 of 2
        run: |
          python3 validation/tests/test_us_investable_registry.py
          python3 validation/tests/test_us_session_bars.py
          python3 validation/tests/test_us_paper_market_data_boundary.py
          ATLAS_DISPOSABLE_CHECKOUT=1 python3 run_all.py --authoritative --fail-fast --regression-shard-count 2 --regression-shard-index 1
      - name: Verify no tracked mutation
        run: git diff --exit-code

  regression-shard-2:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read-only checkout without changing common action-count contract
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Match the authoritative gate Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install existing CI dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Re-run US boundary then approved regression shard 2 of 2
        run: |
          python3 validation/tests/test_us_investable_registry.py
          python3 validation/tests/test_us_session_bars.py
          python3 validation/tests/test_us_paper_market_data_boundary.py
          ATLAS_DISPOSABLE_CHECKOUT=1 python3 run_all.py --authoritative --fail-fast --regression-shard-count 2 --regression-shard-index 2
      - name: Verify no tracked mutation
        run: git diff --exit-code

  full:
    needs: [focused, regression-shard-1, regression-shard-2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Aggregate the complete US gate — every dependency must have succeeded
        env:
          ATLAS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          REQUIRED = ["focused", "regression-shard-1", "regression-shard-2"]
          needs = json.loads(os.environ["ATLAS_NEEDS_JSON"])
          if not isinstance(needs, dict):
              print("aggregate: needs context is not an object")
              sys.exit(1)
          blocked = []
          for key in REQUIRED:
              entry = needs.get(key)
              result = entry.get("result") if isinstance(entry, dict) else None
              print(f"{key}: {result if result else 'missing'}")
              # success 이외의 모든 값(failure/cancelled/skipped/missing/unknown)을 거부한다.
              if result != "success":
                  blocked.append(f"{key}={result if result else 'missing'}")
          unexpected = sorted(set(needs) - set(REQUIRED))
          if unexpected:
              blocked.append(f"unexpected dependency keys={unexpected}")
          if blocked:
              print("US PAPER Market Data Contract = NO — " + "; ".join(blocked))
              sys.exit(1)
          print("US PAPER Market Data Contract = YES — focused + both regression shards succeeded")
          PY
