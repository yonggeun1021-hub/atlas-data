name: R2 KRX Open API Live Proof

on:
  workflow_dispatch:
    inputs:
      recent_date:
        description: "Confirmed prior KRX trading date (YYYYMMDD)"
        required: true

permissions:
  contents: read

jobs:
  r2-krx-live-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: R2 KRX Open API offline contract regression
        run: python3 atlas_krx_r2_openapi_regression.py atlas_krx_r2_openapi_probe.py
      - name: R2 KRX direct live capability proof
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          RECENT_DATE: ${{ inputs.recent_date }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 atlas_krx_r2_openapi_probe.py \
            --market krx \
            --market kospi \
            --market kosdaq \
            --date 20100104 \
            --date "$RECENT_DATE"
      - name: Dirty artifact check
        run: git diff --exit-code
