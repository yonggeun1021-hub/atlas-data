name: Atlas Portfolio Risk Input Snapshot

on:
  schedule:
    - cron: '40 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-portfolio-risk-input
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline contract regression
        run: python3 test/test_portfolio_risk_input.py
      - name: Capture Alpaca paper account/position snapshot (READ-ONLY -- see portfolio_risk/alpaca_client.py)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python3 -m portfolio_risk.capture
      - name: Commit append-only evidence and latest pointer
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add evidence/operational/portfolio_risk_input data/latest_portfolio_risk_input.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: portfolio risk input snapshot $(date -u +%Y-%m-%d)"
          git push
