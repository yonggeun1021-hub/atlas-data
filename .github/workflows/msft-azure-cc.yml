# RULE-0021 — MSFT Azure constant-currency 성장률 관측 (수동 실행 전용)
#
# ★ 목적: P2-b 에서 확정한 document-semantic extraction 계약이 실제 GitHub-hosted
#   acquisition 에서도 재현되는지 검증한다. AVAILABLE 숫자를 늘리는 것이 목적이 아니다.
#
# ⛔ 저장소를 쓰지 않는다 — commit · push · fixture 덮어쓰기 없음.
# ⛔ 45% 기준선 · 3%p 하회 판정은 evaluator 층이며 이 실행에서 계산하지 않는다.
# ⛔ 값이 없거나 구조가 달라지면 추정·대체하지 않고 fail-closed.
# ⛔ Rule 상태 변경 · evaluator wiring · Production 연결과 무관하다.
# ⛔ `run_all.py` 의 결정론적 회귀에는 네트워크를 넣지 않는다 — 이 검증은 분리돼 있다.
name: msft-azure-cc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: RULE-0021 Azure cc 관측 + 복수 분기 재현
        run: python3 collectors/msft_azure_cc.py

      - name: 저장소가 그대로인지 (쓰기 없음 확인)
        run: git diff --exit-code
