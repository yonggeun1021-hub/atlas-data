name: Korea Leadership Live Proof

# 2026-09-04 CIO-approved P2-03 bounded cadence slice.
#
# Closes the "honest schedule gap" this repo already documented for this
# exact workflow (docs/korea_capital_rotation_contract.md, 2026-08-22):
# Leadership had no cron and only ever ran on manual workflow_dispatch.
# That gap was left open on purpose at the time ("no new cron" precedent
# for that PR's own bounded scope), not because scheduling was judged
# unsafe. The same schedule is now the controller for the existing combined
# observation-pair workflow. No cron, provider, or producer implementation is
# duplicated; manual workflow_dispatch keeps the standalone Leadership path.
#
# Schedule time reuses the exact existing evening cadence
# korea-market-signals.yml already established for the same "after KRX's
# post-18:00 evening publication window" purpose -- 18:10 and 18:25 KST
# (`10 9 * * 1-5` / `25 9 * * 1-5`), the second slot an idempotent
# recovery chance exactly as in that workflow. This is not a new time: it
# is also the exact `earliest_usable_time` already ratified in
# config/korea_leadership_policy.json.
#
# A scheduled run never assumes "today" is a completed KRX trading date.
# It discovers the two most recently completed sessions by calling
# korea_market_signals.py's own discover_session_pair() (imported
# unchanged, dynamically -- same pattern this repo already uses to load
# one script from another) -- the same live-KRX-probe resolver
# korea-market-signals.yml's own scheduled path already relies on to find
# real completed sessions across weekends/holidays without any invented
# trading-day calendar. The scheduled path then calls the reusable P2-03
# workflow synchronously and verifies its final artifact. Manual
# workflow_dispatch with explicit prior_date/current_date inputs is unchanged.
#
# Reuses the same already-approved R2 KRX Open API index endpoint
# (idx/{kospi,kosdaq}_dd_trd) this repo's own "R2 KRX Open API Live
# Proof" workflow already probes, and the same KRX_API_KEY secret. Not a
# new provider. korea_leadership.py / korea_capital_rotation.py's own
# calculation, thresholds, and state vocabulary are untouched.
#
# config/korea_leadership_policy.json's approval_status is RATIFIED
# today (49 real KOSPI/KOSDAQ sector + benchmark records, effective
# 2026-08-01) -- a real fetch genuinely attempts population against that
# ratified policy; it is not expected to fail closed as "UNRATIFIED" the
# way an earlier revision of this workflow's own comment described.
on:
  workflow_dispatch:
    inputs:
      prior_date:
        description: "Prior completed KRX trading date (YYYYMMDD)"
        required: true
      current_date:
        description: "Current completed KRX trading date (YYYYMMDD)"
        required: true
  schedule:
    - cron: "10 9 * * 1-5"  # 18:10 KST weekdays
    - cron: "25 9 * * 1-5"  # 18:25 KST weekdays -- idempotent recovery slot

permissions:
  contents: read
  actions: read

concurrency:
  group: korea-leadership-live-proof
  cancel-in-progress: false

jobs:
  prepare-scheduled-observation-pair:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      should_call: ${{ steps.decision.outputs.should_call }}
      seed_current_leadership: ${{ steps.readiness.outputs.seed_current_leadership }}
      prior_date: ${{ steps.dates.outputs.prior_date }}
      current_date: ${{ steps.dates.outputs.current_date }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Re-sync controller contracts to current main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
      - name: Scheduled controller focused regression
        run: python3 test/test_korea_observation_pair_controller.py
      - name: Discover completed KRX trading-date pair
        id: dates
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 - <<'PY'
          import datetime as dt
          import importlib.util
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              "korea_market_signals_for_pair_controller",
              root / ".github" / "scripts" / "korea_market_signals.py",
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          output = Path(os.environ["GITHUB_OUTPUT"])
          anchor = dt.datetime.now(ZoneInfo("Asia/Seoul")).date()
          try:
              previous, current = module.discover_session_pair(
                  os.environ["KRX_API_KEY"], anchor=anchor
              )
          except module.KoreaMarketSignalsError as exc:
              reason = str(exc).replace("\r", " ").replace("\n", " ")[:500]
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("ready=false\n")
                  handle.write(f"reason=TWO_COMPLETED_KRX_SESSIONS_NOT_DISCOVERED:{reason}\n")
              print(f"WAIT: TWO_COMPLETED_KRX_SESSIONS_NOT_DISCOVERED:{reason}")
          else:
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("ready=true\n")
                  handle.write(f"prior_date={previous['date']}\n")
                  handle.write(f"current_date={current['date']}\n")
              print(f"resolved prior={previous['date']} current={current['date']}")
          PY
      - name: Check policy effectivity and existing-pair chronology
        id: readiness
        if: steps.dates.outputs.ready == 'true'
        env:
          PRIOR_DATE: ${{ steps.dates.outputs.prior_date }}
          CURRENT_DATE: ${{ steps.dates.outputs.current_date }}
        run: |
          python3 .github/scripts/korea_observation_pair_controller.py request-readiness \
            --prior-date "$PRIOR_DATE" \
            --current-date "$CURRENT_DATE" \
            --out "$RUNNER_TEMP/request-readiness.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path(os.environ["RUNNER_TEMP"] + "/request-readiness.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"call_ready={str(value['call_ready']).lower()}\n")
              handle.write(f"seed_current_leadership={str(value['seed_current_leadership']).lower()}\n")
              handle.write(f"reason={value['status']}\n")
          print(json.dumps(value, ensure_ascii=False, sort_keys=True))
          PY
      - name: Load prior controller and manual-pair runs
        id: runs
        if: steps.readiness.outputs.call_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TITLE: P2-03 Korea Observation Pair ${{ steps.dates.outputs.prior_date }}-${{ steps.dates.outputs.current_date }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/korea-leadership-live-proof.yml/runs?per_page=50" \
            > "$RUNNER_TEMP/controller-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/p2-03-korea-observation-pair.yml/runs?per_page=50" \
            > "$RUNNER_TEMP/pair-runs.json"
          python3 .github/scripts/korea_observation_pair_controller.py classify-runs \
            --runs-json "$RUNNER_TEMP/controller-runs.json" \
            --runs-json "$RUNNER_TEMP/pair-runs.json" \
            --expected-title "$EXPECTED_TITLE" \
            --current-run-id "${{ github.run_id }}" \
            --out "$RUNNER_TEMP/run-classification.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          value = json.loads((root / "run-classification.json").read_text())
          active = value["active_same_request_runs"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"active_duplicate={str(bool(active)).lower()}\n")
          with (root / "active-runs.tsv").open("w", encoding="utf-8") as handle:
              for row in active:
                  handle.write(f"{row['run_id']}\t{row['run_attempt']}\n")
          with (root / "successful-candidates.tsv").open("w", encoding="utf-8") as handle:
              for row in value["successful_artifact_candidates"]:
                  handle.write(f"{row['run_id']}\t{row['run_attempt']}\n")
          print(json.dumps(value, sort_keys=True))
          PY
      - name: Wait for an already-active exact request
        if: steps.readiness.outputs.call_ready == 'true' && steps.runs.outputs.active_duplicate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r RUN_ID RUN_ATTEMPT; do
            test -n "$RUN_ID" || continue
            if gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
              echo "$RUN_ID"$'\t'"$RUN_ATTEMPT" >> "$RUNNER_TEMP/successful-candidates.tsv"
            else
              RUN_STATE=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '[.status, .conclusion] | @tsv')
              if [[ "$RUN_STATE" == completed$'\t'* ]]; then
                echo "active exact request $RUN_ID completed without success; controller recovery remains eligible"
              else
                echo "STOP: exact request $RUN_ID did not reach a terminal state" >&2
                exit 2
              fi
            fi
          done < "$RUNNER_TEMP/active-runs.tsv"
      - name: Accept dedupe only from an exact validated final artifact
        id: artifact
        if: steps.readiness.outputs.call_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_DATE: ${{ steps.dates.outputs.prior_date }}
          CURRENT_DATE: ${{ steps.dates.outputs.current_date }}
        run: |
          VALIDATED=false
          while IFS=$'\t' read -r RUN_ID RUN_ATTEMPT; do
            test -n "$RUN_ID" || continue
            CANDIDATE_DIR="$RUNNER_TEMP/prior-handoff-$RUN_ID-$RUN_ATTEMPT"
            ARTIFACT_NAME="p2-03-current-ratified-rotation-$RUN_ID-$RUN_ATTEMPT"
            if gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$ARTIFACT_NAME" \
              --dir "$CANDIDATE_DIR"
            then
              if python3 .github/scripts/korea_observation_pair_controller.py verify-handoff \
                --artifact-dir "$CANDIDATE_DIR" \
                --prior-date "$PRIOR_DATE" \
                --current-date "$CURRENT_DATE"
              then
                VALIDATED=true
                echo "validated prior artifact from run $RUN_ID attempt $RUN_ATTEMPT"
                break
              fi
            fi
          done < "$RUNNER_TEMP/successful-candidates.tsv"
          echo "validated=$VALIDATED" >> "$GITHUB_OUTPUT"
      - name: Decide whether to call the combined workflow
        id: decision
        env:
          DATES_READY: ${{ steps.dates.outputs.ready }}
          DATE_REASON: ${{ steps.dates.outputs.reason }}
          REQUEST_READY: ${{ steps.readiness.outputs.call_ready }}
          REQUEST_REASON: ${{ steps.readiness.outputs.reason }}
          VALIDATED_ARTIFACT: ${{ steps.artifact.outputs.validated }}
        run: |
          if [ "$DATES_READY" != "true" ]; then
            SHOULD_CALL=false
            REASON="${DATE_REASON:-INPUT_NOT_READY}"
          elif [ "$REQUEST_READY" != "true" ]; then
            SHOULD_CALL=false
            REASON="${REQUEST_REASON:-REQUEST_NOT_READY}"
          elif [ "$VALIDATED_ARTIFACT" = "true" ]; then
            SHOULD_CALL=false
            REASON="EXACT_FINAL_ROTATION_HANDOFF_ALREADY_VALIDATED"
          else
            SHOULD_CALL=true
            REASON="CALL_COMBINED_WORKFLOW"
          fi
          echo "should_call=$SHOULD_CALL" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "scheduled pair controller: should_call=$SHOULD_CALL reason=$REASON"

  seed-effective-date-leadership:
    needs: prepare-scheduled-observation-pair
    if: needs.prepare-scheduled-observation-pair.outputs.seed_current_leadership == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PRIOR_DATE: ${{ needs.prepare-scheduled-observation-pair.outputs.prior_date }}
      CURRENT_DATE: ${{ needs.prepare-scheduled-observation-pair.outputs.current_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Effective-date Leadership seed focused regression
        run: |
          python3 test/test_korea_observation_pair_controller.py
          python3 test/test_korea_leadership_live_fetch.py
      - name: Reuse an exact committed effective-date Leadership observation
        id: existing_leadership
        run: |
          ISO_DATE="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          CONTEXT_PATH="data/observations/korea_leadership_context/$ISO_DATE/packet.json"
          if test -f "$CONTEXT_PATH"; then
            python3 .github/scripts/korea_leadership_live_fetch.py \
              --prior-date "$PRIOR_DATE" \
              --current-date "$CURRENT_DATE" \
              --verify-existing-only
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Korea Leadership effective-date real KRX index fetch attempt
        if: steps.existing_leadership.outputs.exists != 'true'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_leadership_live_fetch.py \
            --prior-date "$PRIOR_DATE" \
            --current-date "$CURRENT_DATE"
      - name: Commit effective-date Korea Leadership evidence
        if: steps.existing_leadership.outputs.exists != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add data/observations/korea_leadership_context
          if git diff --cached --quiet; then
            echo "no change (verified_existing) -- nothing to commit"
          else
            git commit -m "korea leadership effective-date seed $(date -u +%Y-%m-%d) [run ${{ github.run_id }}] [trigger=${{ github.event_name }}]"
            bash .github/scripts/push_to_default_branch.sh "$DEFAULT_BRANCH"
          fi
      # Runs only after the reuse check or the fetch+commit above has
      # already preserved this date's attempt evidence (reused evidence
      # is re-checked here too) -- opt-in on top of the unchanged
      # --verify-existing-only integrity check, never a second provider
      # call. continue-on-error: true because a faithfully preserved
      # BLOCKED attempt is an expected, honest outcome, not a workflow
      # failure -- this step only distinguishes and logs that a usable
      # Leadership seed is not yet available, it never fails the job,
      # invokes Stage3, or changes the schedule/commit scope above.
      - name: Confirm effective-date Leadership seed usable-seed readiness
        id: seed_readiness
        continue-on-error: true
        run: |
          python3 .github/scripts/korea_leadership_live_fetch.py \
            --prior-date "$PRIOR_DATE" \
            --current-date "$CURRENT_DATE" \
            --verify-existing-only \
            --require-usable-seed

  scheduled-observation-pair:
    needs: prepare-scheduled-observation-pair
    if: needs.prepare-scheduled-observation-pair.outputs.should_call == 'true'
    uses: ./.github/workflows/p2-03-korea-observation-pair.yml
    permissions:
      contents: write
      actions: read
    with:
      breadth_recent_previous: ${{ needs.prepare-scheduled-observation-pair.outputs.prior_date }}
      breadth_recent_date: ${{ needs.prepare-scheduled-observation-pair.outputs.current_date }}
      leadership_prior_date: ${{ needs.prepare-scheduled-observation-pair.outputs.prior_date }}
      leadership_current_date: ${{ needs.prepare-scheduled-observation-pair.outputs.current_date }}
    secrets: inherit

  verify-scheduled-observation-pair-handoff:
    needs:
      - prepare-scheduled-observation-pair
      - scheduled-observation-pair
    if: needs.prepare-scheduled-observation-pair.outputs.should_call == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Re-sync verifier to current committed source lineage
        run: |
          git fetch origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
      - name: Download this run's final rotation handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: p2-03-current-ratified-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-03-final-handoff
      - name: Verify exact pair, current policy/source identity, and final artifact
        env:
          PRIOR_DATE: ${{ needs.prepare-scheduled-observation-pair.outputs.prior_date }}
          CURRENT_DATE: ${{ needs.prepare-scheduled-observation-pair.outputs.current_date }}
        run: |
          python3 .github/scripts/korea_observation_pair_controller.py verify-handoff \
            --artifact-dir "$RUNNER_TEMP/p2-03-final-handoff" \
            --prior-date "$PRIOR_DATE" \
            --current-date "$CURRENT_DATE"
          git diff --exit-code

  # Korea five-signal pointer production.
  #
  # data/latest_korea_market_signals.json had no automated writer: it was
  # last produced on 2026-09-11T09:24Z and then froze, because
  # korea-market-signals.yml -- the only workflow that ever ran the
  # ratified producer -- is `permissions: contents: read` and packages its
  # output as an artifact instead of committing it. That pointer is the
  # session-date source for decision/korea_population_symbol_observation.py,
  # so the KR population observation stayed pinned to 2026-09-10 while
  # newer krx_global_universe packets accumulated unconsumed.
  #
  # This job is that writer, and it is deliberately placed here rather
  # than given its own schedule: this run has already resolved a real
  # completed KRX session pair (prepare-scheduled-observation-pair) and
  # this run's own p2-03 call has already committed the
  # krx_global_universe packet for the same `current_date`. Producing the
  # five-signal pointer in the same run is what makes the pointer's
  # session and the universe's session the same session by construction --
  # the coupling decision/korea_population_symbol_observation.py enforces
  # as KR_UNIVERSE_SESSION_MISMATCH. No cron is added or changed, and the
  # dates are the resolved pair verbatim; nothing here invents a session.
  #
  # Exactly one additional collection call: the ratified producer
  # .github/scripts/korea_market_signals.py (not the pykrx candidate),
  # invoked once for the already-resolved pair, reusing the same
  # KRX_API_KEY secret and the producer's own unchanged ratified request
  # pattern against the KRX Open API endpoints this repository already
  # collects from. The resolved sessions' rows are not re-passed from the
  # prepare job: that would move raw KRX rows through workflow outputs,
  # which is prohibited -- so the one call is the honest cost.
  #
  # The bounded review rebuild that follows is a local recomputation from
  # the produced pointer, not a second provider call. It is required, not
  # optional: load_context() rebuilds the review from the pointer and
  # fails KR_BOUNDED_REVIEW_NOT_REPRODUCIBLE unless the committed
  # data/latest_korea_symbol_market_review.json is the rebuild of the
  # same pointer.
  #
  # Nothing here relaxes a coupling. KR_UNIVERSE_SESSION_MISMATCH and
  # KR_BOUNDED_REVIEW_SESSION_MISMATCH are untouched; this job satisfies
  # them by supplying a real newer pointer plus its matching rebuild.
  publish-scheduled-five-signal-pointer:
    needs:
      - prepare-scheduled-observation-pair
      - scheduled-observation-pair
    if: needs.prepare-scheduled-observation-pair.outputs.should_call == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PRIOR_DATE: ${{ needs.prepare-scheduled-observation-pair.outputs.prior_date }}
      CURRENT_DATE: ${{ needs.prepare-scheduled-observation-pair.outputs.current_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Five-signal pointer offline regression
        run: |
          python3 test/test_korea_market_signals.py
          python3 test/test_korea_symbol_market_review.py
      # Re-sync before producing, never after: the pointer is a tracked
      # file, so a `git reset --hard` placed after the producer would
      # silently throw the produced pointer away. This run's own p2-03
      # universe commit is picked up here.
      - name: Re-sync the pointer lineage to current main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
      # Idempotency, using the producer's own append-only reuse path: when
      # this session's dated observation packet is already committed,
      # korea_market_signals.py returns reused=True and republishes that
      # exact committed packet without contacting the provider. This step
      # therefore has no KRX_API_KEY in its env at all -- a provider call
      # is structurally impossible here, not merely unused.
      - name: Reuse an exact committed five-signal observation instead of re-fetching the same session
        id: existing_signals
        run: |
          ISO_DATE="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          PACKET_PATH="data/observations/korea_market_signals/$ISO_DATE/packet.json"
          if test -f "$PACKET_PATH"; then
            python3 .github/scripts/korea_market_signals.py --verify "$PACKET_PATH"
            python3 .github/scripts/korea_market_signals.py \
              --previous-date "$PRIOR_DATE" \
              --current-date "$CURRENT_DATE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The one approved additional collection call. No continue-on-error:
      # a failed or partial KRX fetch fails this job here, before the
      # verification and commit steps below ever run, so a partial
      # pointer is never committed. The producer itself publishes only
      # after build_packet() + validate_packet() succeed, and writes
      # atomically.
      - name: Korea five-signal real KRX session-pair fetch attempt
        if: steps.existing_signals.outputs.exists != 'true'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_market_signals.py \
            --previous-date "$PRIOR_DATE" \
            --current-date "$CURRENT_DATE"
      - name: Rebuild the bounded Korea symbol review from the produced pointer
        run: python3 decision/korea_symbol_market_review.py
      - name: Verify the produced pointer, its session couplings, and its closed authority boundary
        run: |
          python3 .github/scripts/korea_market_signals.py \
            --verify data/latest_korea_market_signals.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          expected = dt.datetime.strptime(os.environ["CURRENT_DATE"], "%Y%m%d").date().isoformat()
          packet = json.loads(Path("data/latest_korea_market_signals.json").read_text())
          assert packet["as_of_date"] == expected, packet["as_of_date"]
          assert packet["status"] == "OBSERVED_UNCLASSIFIED"
          assert packet["coverage"]["ratio"] == "5/5"
          # Raw KRX rows are private-only. The published pointer carries
          # per-axis aggregates and response digests only, and says so.
          assert packet["source"]["raw_persistence"] == 0
          assert packet["source"]["per_symbol_persistence"] == 0
          for key, value in packet["authority"].items():
              if key.endswith("_authorized"):
                  assert value is False, key
          # Never advance the pointer past a session the KR population
          # lookup cannot resolve: KR_UNIVERSE_SESSION_MISMATCH is
          # satisfied by a real matching universe packet, never relaxed.
          universe = Path("data/observations/krx_global_universe") / expected / "packet.json"
          assert universe.is_file(), f"KRX_GLOBAL_UNIVERSE_FOR_SESSION_MISSING:{expected}"
          assert json.loads(universe.read_text())["as_of_date"] == expected
          # KR_BOUNDED_REVIEW_SESSION_MISMATCH likewise: the committed
          # review must be this pointer's own rebuild.
          review = json.loads(Path("data/latest_korea_symbol_market_review.json").read_text())
          assert review["operational_date_kst"] == expected, review["operational_date_kst"]
          assert review["source_market_packet_sha256"] == packet["payload_sha256"]
          print(f"PASS_KR_FIVE_SIGNAL_POINTER_SESSION:{expected}")
          PY
      - name: Commit the five-signal pointer and its bounded review
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          git add data/latest_korea_market_signals.json \
            data/observations/korea_market_signals \
            data/latest_korea_symbol_market_review.json \
            evidence/korea_symbol_market_review
          if git diff --cached --quiet; then
            echo "no change (reused) -- nothing to commit"
            exit 0
          fi
          ISO_DATE="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          git commit -m "korea five-signal pointer $ISO_DATE [run ${{ github.run_id }}] [trigger=${{ github.event_name }}]"
          PUSH_RETRY_BACKOFF_SECONDS=10 bash .github/scripts/push_to_default_branch.sh "$DEFAULT_BRANCH" 3

  korea-leadership-live-fetch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Korea Leadership live-fetch offline contract regression
        run: python3 test/test_korea_leadership_live_fetch.py
      - name: Bind manual workflow_dispatch trading dates
        if: github.event_name == 'workflow_dispatch'
        env:
          PRIOR_DATE_INPUT: ${{ inputs.prior_date }}
          CURRENT_DATE_INPUT: ${{ inputs.current_date }}
        run: |
          echo "PRIOR_DATE=$PRIOR_DATE_INPUT" >> "$GITHUB_ENV"
          echo "CURRENT_DATE=$CURRENT_DATE_INPUT" >> "$GITHUB_ENV"
      # Reuses atlas_krx_r2_openapi_probe.py's own request/fetch/decode
      # primitives unchanged, then attempts korea_leadership.py's own
      # build_transform() unchanged -- see the top-of-file comment for
      # this workflow's current ratified/unratified expectation.
      - name: Reuse an exact committed Leadership observation instead of re-fetching the same date
        id: existing_leadership
        env:
          PRIOR_DATE: ${{ env.PRIOR_DATE }}
          CURRENT_DATE: ${{ env.CURRENT_DATE }}
        run: |
          ISO_DATE="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          CONTEXT_PATH="data/observations/korea_leadership_context/$ISO_DATE/packet.json"
          if test -f "$CONTEXT_PATH"; then
            python3 .github/scripts/korea_leadership_live_fetch.py \
              --prior-date "$PRIOR_DATE" \
              --current-date "$CURRENT_DATE" \
              --verify-existing-only
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Korea Leadership real KRX index fetch attempt
        if: steps.existing_leadership.outputs.exists != 'true'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRIOR_DATE: ${{ env.PRIOR_DATE }}
          CURRENT_DATE: ${{ env.CURRENT_DATE }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_leadership_live_fetch.py \
            --prior-date "$PRIOR_DATE" \
            --current-date "$CURRENT_DATE"
      - name: Commit Korea Leadership live-fetch attempt evidence
        if: steps.existing_leadership.outputs.exists != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          # This job's own checkout is pinned to the SHA fixed at trigger
          # time, not main's live tip -- re-sync before committing so a
          # concurrent push from another job/workflow cannot turn this
          # push into a spurious non-fast-forward rejection. The shared push
          # script's own rebase-and-retry is the bounded fallback if a race
          # still lands in the gap after this re-sync.
          git fetch origin main
          git reset --hard origin/main
          git add data/observations/korea_leadership_context
          if git diff --cached --quiet; then
            echo "no change (verified_existing) -- nothing to commit"
          else
            git commit -m "korea leadership live-fetch attempt $(date -u +%Y-%m-%d) [run ${{ github.run_id }}] [trigger=${{ github.event_name }}]"
            bash .github/scripts/push_to_default_branch.sh "$DEFAULT_BRANCH"
          fi
