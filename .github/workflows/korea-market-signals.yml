name: Korea Market Five Signals

on:
  workflow_dispatch:
    inputs:
      previous_date:
        description: "Previous completed KRX session (YYYYMMDD)"
        required: true
      current_date:
        description: "Current completed KRX session (YYYYMMDD)"
        required: true

permissions:
  contents: read

concurrency:
  group: korea-market-five-signals-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Offline five-signal regression
        run: python3 test/test_korea_market_signals.py
      - name: Collect explicit official KRX session pair
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PREVIOUS_DATE: ${{ inputs.previous_date }}
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_market_signals.py \
            --previous-date "$PREVIOUS_DATE" \
            --current-date "$CURRENT_DATE"
      - name: Verify exact output and closed authority boundary
        env:
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          python3 .github/scripts/korea_market_signals.py \
            --verify data/latest_korea_market_signals.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          expected = dt.datetime.strptime(os.environ["CURRENT_DATE"], "%Y%m%d").date().isoformat()
          packet = json.loads(Path("data/latest_korea_market_signals.json").read_text())
          assert packet["as_of_date"] == expected
          assert packet["status"] == "OBSERVED_UNCLASSIFIED"
          assert packet["coverage"]["ratio"] == "5/5"
          assert packet["source"]["raw_persistence"] == 0
          assert packet["source"]["per_symbol_persistence"] == 0
          for key, value in packet["authority"].items():
              if key.endswith("_authorized"):
                  assert value is False, key
          PY
      - name: Package observation without publishing
        env:
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          CURRENT_ISO="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          mkdir -p artifact/data/observations/korea_market_signals/"$CURRENT_ISO"
          cp data/latest_korea_market_signals.json artifact/data/latest_korea_market_signals.json
          cp data/observations/korea_market_signals/"$CURRENT_ISO"/packet.json \
            artifact/data/observations/korea_market_signals/"$CURRENT_ISO"/packet.json
          git status --short
      - name: Upload exact observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: korea-market-signals-${{ inputs.current_date }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
