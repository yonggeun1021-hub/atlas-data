name: Korea Market Five Signals

on:
  workflow_dispatch:
    inputs:
      previous_date:
        description: "Previous completed KRX session (YYYYMMDD)"
        required: true
      current_date:
        description: "Current completed KRX session (YYYYMMDD)"
        required: true

permissions:
  contents: read

concurrency:
  group: korea-market-five-signals-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install KRX cross-check dependency
        run: |
          mkdir -p artifact/dependency-wheels
          python3 -m pip download --only-binary=:all: --require-hashes \
            -r requirements-korea-paper-source.lock \
            -d artifact/dependency-wheels
          python3 .github/scripts/verify_kr_paper_source_dependencies.py \
            --contract config/krx_information_system_source_candidate_v1.json \
            --wheel-dir artifact/dependency-wheels \
            --skip-installed \
            --out artifact/dependency-wheel-verification.json
          python3 -m pip install --no-index --find-links artifact/dependency-wheels \
            --only-binary=:all: --require-hashes \
            -r requirements-korea-paper-source.lock
          python3 .github/scripts/verify_kr_paper_source_dependencies.py \
            --contract config/krx_information_system_source_candidate_v1.json \
            --wheel-dir artifact/dependency-wheels
      - name: Offline five-signal regression
        run: |
          python3 test/test_korea_market_signals.py
          python3 test/test_korea_leadership_live_fetch.py
          python3 test/test_korea_market_signals_pykrx_candidate.py
          python3 test/test_krx_information_system_capture.py
      - name: Collect explicit official KRX session pair
        id: market_signals
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PREVIOUS_DATE: ${{ inputs.previous_date }}
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_market_signals.py \
            --previous-date "$PREVIOUS_DATE" \
            --current-date "$CURRENT_DATE"
      - name: Collect exact official KRX Leadership observation
        id: leadership
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PREVIOUS_DATE: ${{ inputs.previous_date }}
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_leadership_live_fetch.py \
            --prior-date "$PREVIOUS_DATE" \
            --current-date "$CURRENT_DATE"
      - name: Cross-check KRX Information Data System availability
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PREVIOUS_DATE: ${{ inputs.previous_date }}
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          mkdir -p artifact
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from pykrx import stock

          dates = (os.environ["PREVIOUS_DATE"], os.environ["CURRENT_DATE"])
          markets = ("KOSPI", "KOSDAQ")
          result = {
              "schema": "krx_information_data_system_availability_probe/1",
              "dates": list(dates),
              "authority": {
                  "regime_authorized": False,
                  "trading_authorized": False,
                  "order_authorized": False,
                  "real_authorized": False,
              },
              "observations": {},
          }

          def probe(label, call):
              try:
                  frame = call()
              except Exception as exc:
                  return {"status": "ERROR", "error_type": type(exc).__name__, "detail": str(exc)[:300]}
              return {
                  "status": "AVAILABLE" if not frame.empty else "EMPTY",
                  "row_count": int(len(frame.index)),
                  "columns": [str(value) for value in frame.columns],
              }

          for date in dates:
              result["observations"][date] = {}
              for market in markets:
                  result["observations"][date][market] = {
                      "stock_ohlcv": probe(
                          "stock_ohlcv",
                          lambda d=date, m=market: stock.get_market_ohlcv_by_ticker(d, m, alternative=False),
                      ),
                      "market_cap": probe(
                          "market_cap",
                          lambda d=date, m=market: stock.get_market_cap_by_ticker(d, m, alternative=False),
                      ),
                      "index_ohlcv": probe(
                          "index_ohlcv",
                          lambda d=date, m=market: stock.get_index_ohlcv_by_ticker(d, m),
                      ),
                  }
          Path("artifact/PYKRX_PROBE.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
      - name: Build KRX information-system PAPER reference candidate
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PREVIOUS_DATE: ${{ inputs.previous_date }}
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          FETCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 .github/scripts/korea_market_signals_pykrx_candidate.py \
            --previous-date "$PREVIOUS_DATE" \
            --current-date "$CURRENT_DATE" \
            --fetched-at "$FETCHED_AT" \
            --capture-dir artifact/source-capture \
            --out artifact/KR_PAPER_REFERENCE_CANDIDATE.json
      - name: Verify exact output and closed authority boundary
        if: steps.market_signals.outcome == 'success'
        env:
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          python3 .github/scripts/korea_market_signals.py \
            --verify data/latest_korea_market_signals.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          expected = dt.datetime.strptime(os.environ["CURRENT_DATE"], "%Y%m%d").date().isoformat()
          packet = json.loads(Path("data/latest_korea_market_signals.json").read_text())
          assert packet["as_of_date"] == expected
          assert packet["status"] == "OBSERVED_UNCLASSIFIED"
          assert packet["coverage"]["ratio"] == "5/5"
          assert packet["source"]["raw_persistence"] == 0
          assert packet["source"]["per_symbol_persistence"] == 0
          for key, value in packet["authority"].items():
              if key.endswith("_authorized"):
                  assert value is False, key
          PY
      - name: Package observation without publishing
        env:
          CURRENT_DATE: ${{ inputs.current_date }}
        run: |
          CURRENT_ISO="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          if test "${{ steps.leadership.outcome }}" = success; then
            mkdir -p artifact/data/observations/korea_leadership_context/"$CURRENT_ISO"
            cp data/observations/korea_leadership_context/"$CURRENT_ISO"/packet.json \
              artifact/data/observations/korea_leadership_context/"$CURRENT_ISO"/packet.json
          fi
          if test "${{ steps.market_signals.outcome }}" = success; then
            mkdir -p artifact/data/observations/korea_market_signals/"$CURRENT_ISO"
            cp data/latest_korea_market_signals.json artifact/data/latest_korea_market_signals.json
            cp data/observations/korea_market_signals/"$CURRENT_ISO"/packet.json \
              artifact/data/observations/korea_market_signals/"$CURRENT_ISO"/packet.json
          fi
          git status --short
      - name: Upload exact observation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: korea-market-signals-${{ inputs.current_date }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
