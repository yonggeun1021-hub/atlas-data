name: SPDR Sector Holdings Capture

# RULE.UNIVERSE.US_STOCK_SPDR_SECTOR_MAPPING.V1 evidence capture
# (collectors/spdr_sector_holdings.py). Manual only in this PR --
# workflow_dispatch is the sole trigger; no schedule is enabled here.
#
# ⚠ Unlike a price or FX series, a fund's holdings on a given day are never
#   published again once that day passes -- this data is physically
#   time-gated and cannot be backfilled (see the collector's module
#   docstring). Every day this schedule stays off is a day of point-in-time
#   sector evidence that can never be recovered later. This PR recommends
#   enabling the proposed daily schedule below immediately once this
#   workflow's first manual dispatch confirms the SSGA holdings URL/layout
#   actually work (see "First dispatch is also verification" below) --
#   see the PR body for the exact Korean approval sentences needed for
#   (1) enabling the schedule and (2) the first live dispatch itself.
#
# Proposed cron (NOT enabled by this workflow):
#   '0 22 * * 1-5'  # ~07:00 KST Tue-Sat, i.e. after each US trading day's
#                    # close and well after SSGA's own next-business-day
#                    # holdings refresh, Mon-Fri UTC (covers Mon-Fri US
#                    # sessions; Monday's capture reflects Friday's holdings
#                    # file if SSGA has not refreshed yet -- acceptable
#                    # since the reader always records the actual capture
#                    # date, never assumes same-day freshness).
#
# First dispatch is also verification: collectors/spdr_sector_holdings.py's
# HOLDINGS_URL_TEMPLATE and workbook layout parsing were never exercised
# against the real SSGA endpoint before this PR (no live network call was
# made building it -- see the collector's module docstring, "URL pattern"
# section). Treat the first real run of this workflow as that check, not
# as a routine capture: read its logs before trusting the commit.
#
# No new secret: this collector needs no credential (SSGA's daily holdings
# download is public). Derived-only storage: the downloaded workbook itself
# is never committed (see "Licensing" in the collector's module docstring)
# -- only a derived symbol/sector/rank mapping plus capture metadata/hash.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers to capture (default: all 11 SPDR Select Sector ETFs)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: atlas-spdr-sector-holdings
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install parser dependency (openpyxl -- no network beyond PyPI)
        run: python3 -m pip install --quiet "openpyxl>=3.1.0"
      - name: Offline contract regression (fixture workbook, fake HTTP layer, no network)
        run: |
          python3 test/test_spdr_sector_holdings.py
          python3 test/test_us_spdr_sector_mapping.py
      - name: Capture SPDR sector holdings (derived mapping only, no raw workbook committed)
        # CIO review 2026-09-15 (PR #761): the untrusted workflow_dispatch
        # input is never substituted directly into the run: script text
        # (that would let its content be parsed as shell before reaching
        # Python -- a script-injection risk). It is passed through env: and
        # referenced only as a quoted shell variable, so bash performs no
        # word-splitting/glob expansion on it either; collectors/
        # spdr_sector_holdings.py itself splits and validates every ticker
        # against the 11-ticker SECTOR_ETFS allowlist before making any
        # HTTP request.
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then
            python3 collectors/spdr_sector_holdings.py --tickers "$TICKERS"
          else
            python3 collectors/spdr_sector_holdings.py
          fi
      - name: Commit derived evidence and latest pointer
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add evidence/spdr_sector_holdings data/latest_spdr_sector_holdings.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: SPDR sector holdings evidence $(date -u +%Y-%m-%d)"
          git push
