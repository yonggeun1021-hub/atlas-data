name: SEC Probe (수동 확인용)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: SEC Collector (live)
        env:
          PYTHONPATH: collectors
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python collectors/sec.py
      - name: TSM 확인 (출력 전용)
        if: always()
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/latest_sec.json"))
          t = d["stocks"]["TSM"]
          print("filer_profile      :", t["filer_profile"])
          print("form_family_counts :", t["form_family_counts"])
          print("form_types_on_file :", t["form_types_on_file"])
          st = {}
          for f in t["filings_recent"]:
              st[f["item_status"]] = st.get(f["item_status"], 0) + 1
          print("item_status 분포   :", st)
          print("앞 3건:")
          for f in t["filings_recent"][:3]:
              print("   ", f["date"], f["form"], f["form_family"], f["item_status"])
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: latest_sec
          path: data/latest_sec.json
