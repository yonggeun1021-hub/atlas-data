name: P9-04 evidence-only recovery journal

on:
  pull_request:
    paths:
      - '.github/workflows/p9-04-recovery-journal.yml'
      - 'config/action_order_idempotency_contract.json'
      - 'config/action_order_recovery_journal_contract.json'
      - 'decision/action_order_idempotency.py'
      - 'decision/action_order_recovery_journal.py'
      - 'docs/action_order_idempotency_contract.md'
      - 'test/test_action_order_idempotency.py'
      - 'test/p9_04_recovery_journal/test_recovery_journal.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p9-04-recovery-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: P9-04 guard and recovery regression
        run: |
          python3 test/test_action_order_idempotency.py
          python3 test/p9_04_recovery_journal/test_recovery_journal.py
      - name: No tracked mutation
        run: git diff --exit-code
