name: P1-US-04 US Breadth Forward Capture

on:
  schedule:
    # 01:20 UTC Tue-Sat: regular US session date after close in both EDT/EST.
    - cron: "20 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-us-breadth-forward-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Offline forward-source regression
        run: python3 test/test_us_breadth_forward.py
      - name: Capture official current-day directories append-only
        id: capture
        run: |
          set -euo pipefail
          ROOT="$PWD"
          STAGING_PARENT=$(mktemp -d "$RUNNER_TEMP/us-breadth.XXXXXX")
          CAPTURE="$STAGING_PARENT/capture"
          trap 'rm -rf "$STAGING_PARENT"' EXIT
          mkdir -p "$CAPTURE"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$CAPTURE/_downloaded_at.txt"

          fetch () {
            curl --silent --show-error --fail --location \
              --retry 3 --retry-delay 5 --max-time 120 \
              --output "$CAPTURE/$1" "$2"
          }
          fetch nasdaqlisted.txt \
            "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt"
          fetch otherlisted.txt \
            "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"

          cd "$CAPTURE"
          sha256sum nasdaqlisted.txt otherlisted.txt > _sha256.txt
          gzip -n nasdaqlisted.txt otherlisted.txt
          cd "$ROOT"

          SOURCE_DATE=$(python3 .github/scripts/us_breadth_forward.py \
            source-date "$CAPTURE")
          DIR="evidence/us_breadth/raw/$SOURCE_DATE"
          PREVIOUS=$(find evidence/us_breadth/raw -mindepth 1 -maxdepth 1 \
            -type d -name '????-??-??' 2>/dev/null | LC_ALL=C sort | \
            awk -v current="$DIR" '$0 < current' | tail -n 1 || true)
          echo "snapshot_date=$SOURCE_DATE" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/_manifest.json" ]; then
            if [ -n "$PREVIOUS" ]; then
              python3 .github/scripts/us_breadth_forward.py validate-bundle \
                "$DIR" --previous-dir "$PREVIOUS"
            else
              python3 .github/scripts/us_breadth_forward.py validate-bundle "$DIR"
            fi
            echo "이미 $SOURCE_DATE 스냅샷이 존재합니다. 덮어쓰지 않습니다."
            echo "result=skipped_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -e "$DIR" ]; then
            echo "불완전한 기존 경로가 있어 덮어쓰지 않습니다: $DIR" >&2
            exit 1
          fi

          DATED="$STAGING_PARENT/$SOURCE_DATE"
          mv "$CAPTURE" "$DATED"
          python3 .github/scripts/us_breadth_forward.py manifest "$DATED" \
            --collector-version us-breadth-forward-capture/v1
          python3 .github/scripts/us_breadth_forward.py validate "$DATED"

          if [ -n "$PREVIOUS" ]; then
            python3 .github/scripts/us_breadth_forward.py diff \
              --previous-dir "$PREVIOUS" --current-dir "$DATED" \
              --out "$DATED/_membership_diff.json"
          else
            python3 .github/scripts/us_breadth_forward.py diff \
              --current-dir "$DATED" --out "$DATED/_membership_diff.json"
          fi
          if [ -n "$PREVIOUS" ]; then
            python3 .github/scripts/us_breadth_forward.py validate-bundle \
              "$DATED" --previous-dir "$PREVIOUS"
          else
            python3 .github/scripts/us_breadth_forward.py validate-bundle "$DATED"
          fi

          mkdir -p "$(dirname "$DIR")"
          mv "$DATED" "$DIR"
          trap - EXIT
          rm -rf "$STAGING_PARENT"

          python3 .github/scripts/us_breadth_forward.py replay-archive

          echo "result=captured" >> "$GITHUB_OUTPUT"
      - name: Commit immutable capture
        if: steps.capture.outputs.result == 'captured'
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/us_breadth/raw/$SNAPSHOT_DATE"
          git commit -m "us breadth universe ${SNAPSHOT_DATE} [${{ github.event_name }}]"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
      # P3-02 source-coverage population is deliberately its own step, after
      # the raw commit above has already landed. Its own failure must never
      # be able to lose or roll back the immutable raw snapshot already
      # committed and pushed by the previous step -- it only reads that
      # committed bundle, never re-fetches or mutates it. Runs on both a
      # fresh capture and a same-day skip, so a packet missing from an
      # earlier run is repaired without any provider call.
      - name: Populate P3-02 US Forward Universe source-coverage packet
        id: populate
        if: |
          always() &&
          (steps.capture.outputs.result == 'captured' || steps.capture.outputs.result == 'skipped_existing')
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
        run: |
          python3 .github/scripts/us_forward_universe_populate.py "$SNAPSHOT_DATE"
      - name: Commit P3-02 source-coverage population
        if: always()
        env:
          SNAPSHOT_DATE: ${{ steps.capture.outputs.snapshot_date }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$SNAPSHOT_DATE" ] && [ -d "data/observations/us_global_universe/$SNAPSHOT_DATE" ]; then
            git add "data/observations/us_global_universe/$SNAPSHOT_DATE"
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "us global universe population ${SNAPSHOT_DATE} [${{ github.event_name }}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
