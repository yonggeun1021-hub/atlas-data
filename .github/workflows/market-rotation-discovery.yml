name: T1 CRYPTO Market Rotation Discovery Daily Build

on:
  schedule:
    - cron: "10 1 * * *"  # 01:10 UTC; after crypto-breadth-capture (00:40 UTC, crypto_leadership) and upbit-universe-capture (00:50 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-market-rotation-discovery-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Offline T1 market_rotation_discovery regression
        run: python3 test/test_market_rotation_discovery.py
      # Read-only display/observation build -- no network call, no order/
      # withdrawal endpoint, no model. See config/market_rotation_discovery_contract.json's
      # authority block and discovery/market_rotation_discovery.py's own
      # module docstring for what this build does and does not do.
      - name: Build T1 CRYPTO rotation discovery packet
        id: build
        run: python3 discovery/market_rotation_discovery.py
      - name: Commit T1 CRYPTO rotation discovery packet
        if: always()
        env:
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT_DATE=$(date -u +%F)
          if [ -d "data/observations/market_rotation_discovery/$SNAPSHOT_DATE" ]; then
            git add "data/observations/market_rotation_discovery/$SNAPSHOT_DATE"
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "T1 crypto rotation discovery ${SNAPSHOT_DATE} [${TRIGGER}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
