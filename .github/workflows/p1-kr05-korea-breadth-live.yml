name: P1-KR-05 Korea Breadth Live Proof

on:
  workflow_dispatch:
    inputs:
      recent_previous:
        description: "Previous completed KRX trading date (YYYYMMDD)"
        required: true
      recent_date:
        description: "Current completed KRX trading date (YYYYMMDD)"
        required: true

permissions:
  contents: read

jobs:
  korea-breadth-live-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: P1-KR-05 offline contract regression
        run: |
          python3 test/test_korea_breadth.py
          python3 test/test_korea_breadth_derived_outputs.py
      # Shares the exact same fetches as the original direct proof --
      # .github/scripts/korea_breadth_derived_outputs.py reuses
      # korea_breadth.py's own request/parse/validate/build_observation
      # unchanged, so this is not a second set of KRX requests. It builds
      # a non-reconstructive Korea Breadth observation packet per market/
      # scope plus one P3-03 KOSPI/KOSDAQ source-coverage packet (reusing
      # universe/krx_global_universe.py's own build_packet() unchanged),
      # writing only under $RUNNER_TEMP -- never a tracked repository file.
      - name: P1-KR-05 historical and recent direct proof
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          RECENT_PREVIOUS: ${{ inputs.recent_previous }}
          RECENT_DATE: ${{ inputs.recent_date }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          mkdir -p "$RUNNER_TEMP/p1-kr05-derived"
          python3 .github/scripts/korea_breadth_derived_outputs.py \
            --market kospi \
            --market kosdaq \
            --historical-previous 20100104 \
            --historical-date 20100105 \
            --recent-previous "$RECENT_PREVIOUS" \
            --recent-date "$RECENT_DATE" \
            --out-dir "$RUNNER_TEMP/p1-kr05-derived"
      - name: Upload P1-KR-05 derived output artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: p1-kr05-derived-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-kr05-derived
          if-no-files-found: warn
      - name: Raw and derived artifact prohibition
        run: git diff --exit-code

  # Separate job, own checkout -- deliberately never touches the job
  # above, whose entire point is to prove NOTHING gets committed from a
  # raw KRX response. Downloads that job's own already-built "recent"
  # scope artifact (no second KRX request) and commits only the non-
  # reconstructive per-market lineage summary
  # (.github/scripts/korea_breadth_context_populate.py) that
  # rotation/korea_capital_rotation_ledger_wire.py reads to build P2-03's
  # coverage_context.breadth. No new schedule/cron: still workflow_
  # dispatch only, same trigger as the job above.
  korea-breadth-context-commit:
    needs: korea-breadth-live-proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Download P1-KR-05 derived output artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: p1-kr05-derived-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-kr05-derived
      - name: Populate committed Korea Breadth context lineage
        run: |
          python3 .github/scripts/korea_breadth_context_populate.py \
            --derived-dir "$RUNNER_TEMP/p1-kr05-derived" \
            --workflow-run-id "${{ github.run_id }}" \
            --capture-mode forward_live
          python3 .github/scripts/korea_global_universe_populate.py \
            --derived-dir "$RUNNER_TEMP/p1-kr05-derived"
      - name: Commit Korea Breadth context lineage
        run: |
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          git add data/observations/korea_breadth_context data/observations/krx_global_universe
          if git diff --cached --quiet; then
            echo "no change (verified_existing) -- nothing to commit"
          else
            git commit -m "korea breadth context lineage $(date -u +%Y-%m-%d) [P1-KR-05 run ${{ github.run_id }}]"
            git push
          fi
