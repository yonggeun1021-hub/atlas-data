name: Atlas Free Market Data Evidence

on:
  schedule:
    - cron: '35 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-free-market-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline contract regression
        run: python3 test/test_free_market_data.py
      - name: Capture FRED VIX and Alpaca IEX evidence
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python3 collectors/free_market_data.py
      - name: Commit immutable evidence and latest pointer
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add evidence/free_market_data data/latest_free_market_data.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: free market evidence $(date -u +%Y-%m-%d)"
          git push
