name: Atlas Free Market Data Evidence

on:
  schedule:
    # 06:35 KST Mon-Sat. Friday's US close is therefore captured for the
    # Saturday/Sunday briefing instead of waiting until Monday morning.
    - cron: '35 21 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-free-market-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline contract regression
        run: |
          python3 test/test_fred_vix_provenance.py
          python3 test/test_free_market_data.py
          python3 test/test_us_symbol_market_review.py
      # FRED public response bytes are retained as content-addressed,
      # append-only evidence and independently replayed before downstream use.
      # A missing dedicated Alpaca key is an explicit PARTIAL result and does
      # not suppress the FRED observation.
      # ★ 2026-08-23 cutover: ALPACA_API_KEY/ALPACA_API_SECRET (account/
      #   trading credential) were removed from this repo's secrets and
      #   now live ONLY in the private atlas-private-evidence repo. This
      #   step intentionally does NOT reference those names -- it requires
      #   a SEPARATE, dedicated, disposable market-data-only credential
      #   (ALPACA_MARKET_DATA_API_KEY/ALPACA_MARKET_DATA_API_SECRET,
      #   labeled ATLAS_MARKET_DATA_ONLY on Alpaca's side), provisioned on
      #   2026-08-26. If either secret is missing or invalid later, only the
      #   Alpaca component is explicitly BLOCKED/PARTIAL; valid FRED derived
      #   evidence remains independently publishable.
      - name: Capture FRED risk/liquidity and Alpaca IEX evidence
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPACA_MARKET_DATA_API_KEY: ${{ secrets.ALPACA_MARKET_DATA_API_KEY }}
          ALPACA_MARKET_DATA_API_SECRET: ${{ secrets.ALPACA_MARKET_DATA_API_SECRET }}
        run: python3 collectors/free_market_data.py
      - name: Connect current market facts to pipeline-symbol review
        run: python3 decision/us_symbol_market_review.py
      # ★ 2026-09-18 ratified fix (USER_RATIFICATION_FREE_MARKET_DATA_PUSH_
      #   RETRY_20260918). A bare `git push` here lost the race against the
      #   other collectors committing to the default branch: runs
      #   34911129881 (2026-09-14T23:57Z), 35163739007 (2026-09-16T23:46Z)
      #   and 35287712594 (2026-09-17T23:38Z) all died at THIS step with
      #   "! [rejected] main -> main (fetch first)" *after* the capture had
      #   already succeeded (alpaca_status READY, status PASS) and written
      #   its evidence. Three US sessions were captured and then dropped,
      #   which is why regime/us_paper_runtime_publication.py was still
      #   reading a 2026-09-15 packet on 2026-09-18.
      #
      #   The shared .github/scripts/push_to_default_branch.sh (already used
      #   by daily-briefing.yml) replays this run's commit on top of whatever
      #   landed meanwhile, bounded at 5 attempts. It is fail-closed: a
      #   rebase conflict aborts the rebase and returns non-zero, and so does
      #   exhausting the attempts, so a dropped commit can never be reported
      #   as success. Collection targets, sources, the committed paths and
      #   the schedule are all unchanged.
      - name: Commit immutable evidence and latest pointer
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add evidence/free_market_data/derived evidence/free_market_data/raw evidence/free_market_data/fred/raw data/latest_free_market_data.json evidence/us_symbol_market_review data/latest_us_symbol_market_review.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: free market evidence $(date -u +%Y-%m-%d)"
          bash .github/scripts/push_to_default_branch.sh "$DEFAULT_BRANCH"
