name: Atlas Free Market Data Evidence

on:
  schedule:
    - cron: '35 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-free-market-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Offline contract regression
        run: python3 test/test_free_market_data.py
      # ★ 2026-08-23 cutover: ALPACA_API_KEY/ALPACA_API_SECRET (account/
      #   trading credential) were removed from this repo's secrets and
      #   now live ONLY in the private atlas-private-evidence repo. This
      #   step intentionally does NOT reference those names -- it requires
      #   a SEPARATE, dedicated, disposable market-data-only credential
      #   (ALPACA_MARKET_DATA_API_KEY/ALPACA_MARKET_DATA_API_SECRET,
      #   labeled ATLAS_MARKET_DATA_ONLY on Alpaca's side), not yet
      #   provisioned. Until it is, this step fails closed with
      #   BLOCKED_BY_DEDICATED_MARKET_DATA_CREDENTIAL -- expected, not a
      #   bug -- rather than silently skipping or reusing the private key.
      - name: Capture FRED VIX and Alpaca IEX evidence
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPACA_MARKET_DATA_API_KEY: ${{ secrets.ALPACA_MARKET_DATA_API_KEY }}
          ALPACA_MARKET_DATA_API_SECRET: ${{ secrets.ALPACA_MARKET_DATA_API_SECRET }}
        run: python3 collectors/free_market_data.py
      - name: Commit immutable evidence and latest pointer
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add evidence/free_market_data data/latest_free_market_data.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: free market evidence $(date -u +%Y-%m-%d)"
          git push
