name: Atlas KRX Post-Close Observation

on:
  schedule:
    # 16:05/16:25/16:45 KST.  GitHub schedule is best-effort, so the first
    # complete exact-date bundle wins and later slots stop at the guard.
    # The payload is still unconfirmed: next-morning collection remains the
    # only path that can promote a same-day row to a decision input.
    - cron: '5 7 * * 1-5'
    - cron: '25 7 * * 1-5'
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-krx-post-close
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # checkout보다 앞에서 실제 runner 도착 시각을 직접 관측한다.
      - name: Capture KRX post-close runner start time
        id: runner_start
        run: echo "observed_started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # delayed schedule도 event 생성 당시 SHA가 아니라 현재 default branch의
          # append-only guard와 telemetry 계약으로 실행한다.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Guard — 오늘자 post-close bundle 확인
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          RESULT=$(python3 collectors/krx_post_close.py --check --date "$TODAY")
          if [ "$RESULT" = "fresh" ]; then SKIP=yes; else SKIP=no; fi
          echo "today_kst=$TODAY / post_close=$RESULT / skip=$SKIP"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: 오늘자 관찰 bundle 존재 — 재수집 생략
        if: steps.guard.outputs.skip == 'yes'
        run: echo "오늘자 immutable post-close observation bundle이 이미 있습니다."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'yes'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        if: steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'yes'
        run: pip install -r requirements.txt

      - name: Collect and publish KRX post-close observation
        id: post_close
        if: steps.guard.outcome == 'success' && steps.guard.outputs.skip != 'yes'
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONPATH: collectors
        run: |
          python3 collectors/krx_post_close.py \
            --date "${{ steps.guard.outputs.today }}"

      # provider를 호출하지 않는 operations telemetry다. Guard 실패, 기존
      # bundle skip, collector 실패까지 read-only clone에서 구분할 수 있다.
      - name: Record KRX post-close scheduler telemetry
        if: always()
        env:
          ATLAS_EVENT_NAME: ${{ github.event_name }}
          ATLAS_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ATLAS_RUN_ID: ${{ github.run_id }}
          ATLAS_RUN_ATTEMPT: ${{ github.run_attempt }}
          ATLAS_RUNNER_STARTED_AT_UTC: ${{ steps.runner_start.outputs.observed_started_at_utc }}
          ATLAS_GUARD_STEP_OUTCOME: ${{ steps.guard.outcome }}
          ATLAS_GUARD_RESULT: ${{ steps.guard.outputs.result }}
          ATLAS_GUARD_SKIP: ${{ steps.guard.outputs.skip }}
          ATLAS_POST_CLOSE_STEP_OUTCOME: ${{ steps.post_close.outcome }}
          ATLAS_REPOSITORY: ${{ github.repository }}
          ATLAS_SERVER_URL: ${{ github.server_url }}
        run: python3 .github/scripts/record_krx_post_close_run.py

      # A partial response is incident evidence, not a briefing read model.
      # Persist it for diagnosis while retaining the collector's failed job.
      - name: Commit post-close observation evidence
        if: always()
        env:
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
          GUARD_SKIP: ${{ steps.guard.outputs.skip }}
          COLLECT_OUTCOME: ${{ steps.post_close.outcome }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          for evidence_path in \
            data/observations/krx_post_close \
            data/incident/krx_post_close \
            data/operations/krx_post_close_runs
          do
            if [ -d "$evidence_path" ]; then
              git add -- "$evidence_path"
            fi
          done

          if [ "$GUARD_SKIP" != "yes" ] && [ "$COLLECT_OUTCOME" = "success" ]; then
            if git diff --staged --quiet -- data/observations/krx_post_close; then
              echo "STOP: successful collection produced no staged observation evidence"
              exit 2
            fi
          fi

          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) KRX post-close [${TRIGGER}]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
