name: P8-12 Dynamic Clock Refresh

# Reuses whatever market evidence the existing collectors already committed
# -- makes ZERO new provider/API calls of its own (clock/run_dynamic_clock.py
# only reads committed evidence/data files, see docs/dynamic_clock_contract.md).
# Fires as a follow-up step after each of the three real collectors this
# module actually consumes complete, plus workflow_dispatch for a manual
# refresh. No new schedule/cron is introduced.
on:
  workflow_run:
    workflows:
      - "BTC Price Daily Capture"
      - "P1-CR-06 Crypto Breadth Daily Capture"
      - "Atlas Daily Collect"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atlas-p8-12-dynamic-clock
  cancel-in-progress: false

jobs:
  refresh:
    # ★ CIO integration spec item 6: `workflow_run.conclusion == 'success'`
    #   is a necessary gate (don't run at all if the upstream collector
    #   itself failed), but it is NEVER treated as proof that fresh
    #   evidence actually landed -- that is verified independently below
    #   (the "Report actual evidence dates found" step reads real
    #   committed files, not GitHub's own run metadata), and the
    #   idempotency check further downstream is what actually decides
    #   whether anything changed, regardless of what this trigger claims.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Candidate canonical-identity observation verifies exact-content git
      # first-seen for authority rows and approval evidence.  As with PR
      # #210's provenance gate, shallow history would make that verification
      # incomplete and silently downgrade real RATIFIED rows.  Full history
      # is therefore part of this workflow's fail-closed contract.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Offline Dynamic Clock regression
        run: |
          # Run each file in its own Python process, matching run_all.py's
          # isolation contract.  `test/` is intentionally not a Python
          # package; importing `test.test_*` is environment-dependent and
          # collided with the runner's own `test` namespace on the first
          # real workflow_run (32786985913).
          for test_file in \
            test/test_dynamic_clock_state_machine.py \
            test/test_review_candidate_contract.py \
            test/test_operational_scan.py \
            test/test_dynamic_clock_end_to_end.py \
            test/test_dynamic_clock_fail_closed.py \
            test/test_dynamic_clock_calendar.py \
            test/test_audit_confirmed_miss.py \
            test/test_dynamic_clock_workflow_wiring.py \
            test/test_dynamic_clock_pit_tier_invariant.py \
            test/test_price_reflection_link.py \
            test/test_dynamic_clock_orchestrator_defects.py \
            test/test_dynamic_clock_time_precision.py \
            test/test_dynamic_clock_operational_evaluation_time.py \
            test/test_candidate_validity_shadow_observation.py \
            test/test_candidate_validity_evidence_inventory.py \
            test/test_price_state_operational_evidence_inventory.py \
            test/test_candidate_lifecycle_observation.py \
            test/test_dynamic_clock_identity_lineage.py \
            test/test_candidate_identity_observation.py \
            test/test_candidate_identity_gap_inventory.py
          do
            python3 "$test_file"
          done
      # ★ CIO review round 2, item 6 (workflow atomicity hardening):
      #   the checkout above happened at job START -- by the time we are
      #   ready to commit, a concurrent collector or another dynamic-clock
      #   run may have already advanced `origin/main`. Re-sync to the
      #   ABSOLUTE LATEST `main` immediately before computing (not after),
      #   so the Dynamic Clock is always computed against the freshest
      #   evidence available at commit time -- mirrors the real race fix
      #   already used elsewhere in this repo (`git fetch && git reset
      #   --hard origin/main` before a write, see PR #205 / p2-03-korea-
      #   observation-pair.yml's own history for the precedent).
      - name: Re-sync to the latest main before computing
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git reset --hard "origin/${{ github.event.repository.default_branch }}"
      - name: Determine one exact operational evaluation instant and its KST decision_date
        id: decision_date
        run: |
          EPOCH_SECONDS=$(date +%s)
          echo "value=$(TZ=Asia/Seoul date -d "@$EPOCH_SECONDS" +%F)" >> "$GITHUB_OUTPUT"
          echo "evaluation_at_utc=$(date -u -d "@$EPOCH_SECONDS" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Recompute Dynamic Clock from currently-committed evidence
        env:
          DECISION_DATE: ${{ steps.decision_date.outputs.value }}
          EVALUATION_AT_UTC: ${{ steps.decision_date.outputs.evaluation_at_utc }}
          OBSERVATION_TRIGGER_KIND: ${{ github.event_name == 'workflow_run' && 'UPSTREAM_WORKFLOW_RUN' || 'MANUAL_WORKFLOW_DISPATCH' }}
        run: python3 clock/run_dynamic_clock.py --decision-date "$DECISION_DATE" --evaluation-at-utc "$EVALUATION_AT_UTC" --observation-trigger-kind "$OBSERVATION_TRIGGER_KIND"
      - name: Resolve candidate identity as a read-only mechanical observation
        env:
          OBSERVATION_TRIGGER_KIND: ${{ github.event_name == 'workflow_run' && 'UPSTREAM_WORKFLOW_RUN' || 'MANUAL_WORKFLOW_DISPATCH' }}
        run: python3 identity/candidate_identity_observation.py --observation-trigger-kind "$OBSERVATION_TRIGGER_KIND"
      - name: Inventory unresolved identity evidence without creating authority
        run: python3 identity/candidate_identity_gap_inventory.py
      - name: Inventory independently revalidatable candidate-validity evidence
        run: python3 clock/candidate_validity_evidence_inventory.py
      - name: Inventory operational Price State linkage without Reflection authority
        run: python3 decision/price_state_operational_evidence_inventory.py
      # ★ Independent verification (item 6): read the REAL per-market
      #   evidence_as_of dates the computation above actually used, from
      #   the freshly-written report itself -- never inferred from
      #   workflow_run's own success/failure metadata. Surfaced in the job
      #   summary so a human/CIO reviewer can see real evidence dates, not
      #   just "the trigger fired".
      - name: Report actual evidence dates found (independent of workflow_run's own success claim)
        run: |
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('evidence/operational/dynamic_clock/dynamic_clock_report.json'))
          print('## P8-12 Dynamic Clock -- real evidence dates found this run')
          print(f"- operational_evaluated_at={d['operational_evaluation']['evaluated_at_utc']}")
          for market, m in d['by_market'].items():
              print(f"- {market}: evidence_as_of={m['evidence_as_of']} decision_date={m['decision_date']}")
          identity = json.load(open('evidence/operational/dynamic_clock/candidate_identity_observation.json'))
          s = identity['summary']
          print(f"- candidate_identity: resolved={s['identity_resolved_count']}/{s['candidate_count']} scope_resolved={s['scope_resolved_count']}/{s['candidate_count']} (mechanical observation only)")
          print('- candidate_identity_history: append-only exact-run record written (validity and money authority remain locked)')
          gaps = json.load(open('evidence/operational/dynamic_clock/candidate_identity_gap_inventory.json'))
          gs = gaps['summary']
          print(f"- identity_authority_gap: unresolved={gs['identity_gap_count']}/{gs['candidate_count']} authority_rows_created=0 (taxonomy adjacency is diagnostic only)")
          validity = json.load(open('evidence/operational/dynamic_clock/candidate_validity_evidence_inventory.json'))
          ns = validity['natural_operational_sample']
          ms = validity['manual_operational_sample']
          print(f"- candidate_validity_evidence: natural_distinct={ns['distinct_evidence_sample_count']} manual_distinct={ms['distinct_evidence_sample_count']} revalidatable_artifacts={validity['evidence_status_counts']['REVALIDATABLE']} (no minimum sample authority; P8-13 locked)")
          price = json.load(open('evidence/operational/dynamic_clock/price_state_operational_evidence_inventory.json'))
          print(f"- price_state_operational_evidence: natural_distinct={price['natural_distinct_sample_count']} live_link_observed={price['natural_price_state_linked_candidate_observed']} (Reflection Status UNKNOWN; P8-13 locked)")
          PY
      - name: Idempotency check + commit only if the evidence actually changed
        id: commit
        run: |
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          git add evidence/operational/dynamic_clock
          if git diff --cached --quiet; then
            echo "no change -- Dynamic Clock output identical to the last committed run, nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "P8-12 Dynamic Clock refresh (triggered by ${{ github.event.workflow_run.name || 'workflow_dispatch' }}, run ${{ github.run_id }})"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      # ★ CIO review round 2, item 6: NEVER rebase-then-push here -- a
      #   rebase could silently land our locally-computed (now
      #   possibly stale, if `main` moved again between the re-sync step
      #   above and this push) result on top of newer evidence without
      #   recomputing against it. Push directly against the commit we
      #   re-synced to; if that fails (a genuine race -- something else
      #   pushed in between), FAIL CLOSED rather than force-push a stale
      #   result. The next real trigger of this workflow (which will fire
      #   again from whatever just pushed) recomputes fresh.
      - name: Push (fail closed on a concurrent-push race, never force)
        if: steps.commit.outputs.committed == 'true'
        run: |
          git push origin "HEAD:${{ github.event.repository.default_branch }}" \
            || { echo "STOP: push rejected -- main advanced since the re-sync step (real race). Not force-pushing a possibly-stale result; the workflow that just landed on main will itself trigger a fresh recompute." >&2; exit 1; }
      - name: Committed-output-only guard (no other tracked file may change)
        run: git diff --exit-code -- . ':!evidence/operational/dynamic_clock'
