name: P2-03 Korea Observation Pair (Breadth -> Leadership, dependency-ordered)
run-name: P2-03 Korea Observation Pair ${{ inputs.leadership_prior_date }}-${{ inputs.leadership_current_date }}

# 2026-08-22: real job dependency wiring for P2-03's own decision_time
# no-lookahead requirement (rotation/korea_capital_rotation.py's PIT
# temporal-invariant correction) -- Korea Breadth capture (job 1-2) must
# genuinely complete and commit BEFORE Korea Leadership's live fetch
# (job 3, `needs:` both prior jobs) runs, so Breadth's real first_seen_at
# is structurally guaranteed to predate Leadership's real available_at
# (decision_time), never manually sequenced by hand each time.
#
# Keeps the existing manual workflow_dispatch entrypoint and adds workflow_call
# for the already-scheduled Leadership controller; this file still defines no
# schedule/cron of its own. Reuses the exact same job steps already approved in
# p1-kr05-korea-breadth-live.yml and
# korea-leadership-live-proof.yml (same scripts, same KRX_API_KEY secret,
# same commit targets), then invokes the existing current-ratified P2-03
# producer after both commits land. This workflow does not duplicate any
# KRX request or rotation logic. The standalone Leadership workflow has an
# existing weekday schedule, and its scheduled path now invokes this combined
# workflow synchronously; see docs/korea_capital_rotation_contract.md.
# A same-date redispatch first validates each already-committed packet and
# reuses its exact bytes.  It never re-requests the provider merely to prove
# idempotency; a missing Leadership packet still fetches Leadership after a
# verified existing Breadth packet, preserving the established recovery path.
on:
  workflow_dispatch:
    inputs:
      breadth_recent_previous:
        description: "Breadth: previous completed KRX trading date (YYYYMMDD)"
        required: true
      breadth_recent_date:
        description: "Breadth: current completed KRX trading date (YYYYMMDD)"
        required: true
      leadership_prior_date:
        description: "Leadership: prior completed KRX trading date (YYYYMMDD)"
        required: true
      leadership_current_date:
        description: "Leadership: current completed KRX trading date (YYYYMMDD) -- the P2-03 observation date"
        required: true
  # The existing Leadership schedule calls this exact workflow synchronously.
  # Reusable inputs are intentionally identical to manual workflow_dispatch;
  # there is one producer implementation and no second scheduler or fetch path.
  workflow_call:
    inputs:
      breadth_recent_previous:
        description: "Breadth: previous completed KRX trading date (YYYYMMDD)"
        required: true
        type: string
      breadth_recent_date:
        description: "Breadth: current completed KRX trading date (YYYYMMDD)"
        required: true
        type: string
      leadership_prior_date:
        description: "Leadership: prior completed KRX trading date (YYYYMMDD)"
        required: true
        type: string
      leadership_current_date:
        description: "Leadership: current completed KRX trading date (YYYYMMDD) -- the P2-03 observation date"
        required: true
        type: string
    secrets:
      KRX_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  korea-breadth-live-proof:
    runs-on: ubuntu-latest
    outputs:
      context_exists: ${{ steps.existing_context.outputs.exists }}
      source_head_sha: ${{ steps.source_revision.outputs.sha }}
      artifact_id: ${{ steps.upload_derived.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_derived.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Bind provider checks to current main
        id: source_revision
        run: |
          git fetch origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reuse an exact committed Breadth context instead of re-fetching the same date
        id: existing_context
        env:
          RECENT_DATE: ${{ inputs.breadth_recent_date }}
        run: |
          ISO_DATE="${RECENT_DATE:0:4}-${RECENT_DATE:4:2}-${RECENT_DATE:6:2}"
          CONTEXT_PATH="data/observations/korea_breadth_context/$ISO_DATE/packet.json"
          if test -f "$CONTEXT_PATH"; then
            python3 .github/scripts/korea_breadth_context_populate.py \
              --verify-existing-date "$ISO_DATE" \
              --capture-mode forward_live
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: P1-KR-05 offline contract regression
        run: |
          python3 test/test_korea_breadth.py
          python3 test/test_korea_breadth_derived_outputs.py
      - name: P1-KR-05 historical and recent direct proof
        if: steps.existing_context.outputs.exists != 'true'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          RECENT_PREVIOUS: ${{ inputs.breadth_recent_previous }}
          RECENT_DATE: ${{ inputs.breadth_recent_date }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          mkdir -p "$RUNNER_TEMP/p1-kr05-derived"
          python3 .github/scripts/korea_breadth_derived_outputs.py \
            --market kospi \
            --market kosdaq \
            --historical-previous 20100104 \
            --historical-date 20100105 \
            --recent-previous "$RECENT_PREVIOUS" \
            --recent-date "$RECENT_DATE" \
            --out-dir "$RUNNER_TEMP/p1-kr05-derived"
      # always() is the same failure-path retention p1-kr05-korea-breadth-live.yml
      # already uses: without it, a failed derived capture skips this upload and
      # the metadata receipt that capture just emitted is lost with the runner.
      # The existing context_exists guard is preserved, so a verified-existing
      # same-date reuse still uploads nothing (it produced no derived dir).
      # This only retains evidence -- the job still fails, so the dependent
      # master/commit and Leadership jobs remain skipped exactly as today.
      - name: Upload P1-KR-05 derived output artifacts
        id: upload_derived
        if: always() && steps.existing_context.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: p1-kr05-derived-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-kr05-derived
          if-no-files-found: warn
      - name: Raw and derived artifact prohibition
        run: git diff --exit-code

  korea-breadth-context-commit:
    needs: korea-breadth-live-proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Download P1-KR-05 derived output artifact
        if: needs.korea-breadth-live-proof.outputs.context_exists != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: p1-kr05-derived-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-kr05-derived
      - name: Populate committed Korea Breadth context lineage
        if: needs.korea-breadth-live-proof.outputs.context_exists != 'true'
        run: |
          # Use the live main tip before creating append-only evidence. The
          # producer remains bound to the exact source revision resolved by
          # the provider job, rather than the older workflow event SHA.
          git fetch origin main
          git reset --hard origin/main
          python3 .github/scripts/korea_breadth_context_populate.py \
            --derived-dir "$RUNNER_TEMP/p1-kr05-derived" \
            --workflow-run-id "${{ github.run_id }}" \
            --capture-mode forward_live
          # Same already-built p3-03 artifact the live-proof job produced --
          # this persists the KRX Global Master exactly as
          # p1-kr05-korea-breadth-live.yml does, with no extra KRX request.
          # Without it this pair run committed Leadership for its observation
          # date while dropping that date's master, so the D consumer tuple in
          # rotation/kr_internal_paper_theme_application.py had no same-date
          # master to pair with the Leadership it just wrote.
          python3 .github/scripts/korea_global_universe_populate.py \
            --derived-dir "$RUNNER_TEMP/p1-kr05-derived"
          ARTIFACT_DIGEST="${{ needs.korea-breadth-live-proof.outputs.artifact_digest }}"
          case "$ARTIFACT_DIGEST" in
            sha256:*) ;;
            *) ARTIFACT_DIGEST="sha256:$ARTIFACT_DIGEST" ;;
          esac
          python3 .github/scripts/korea_breadth_aggregate_populate.py \
            --derived-dir "$RUNNER_TEMP/p1-kr05-derived" \
            --workflow-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --source-head-sha "${{ needs.korea-breadth-live-proof.outputs.source_head_sha }}" \
            --workflow-path ".github/workflows/p2-03-korea-observation-pair.yml" \
            --artifact-id "${{ needs.korea-breadth-live-proof.outputs.artifact_id }}" \
            --artifact-name "p1-kr05-derived-outputs-${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-digest "$ARTIFACT_DIGEST"
      - name: Commit Korea Breadth context lineage
        if: needs.korea-breadth-live-proof.outputs.context_exists != 'true'
        run: |
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          # actions/checkout in this job resolved main at the SHA fixed when
          # this workflow_dispatch run started -- it does not track main's
          # live tip. A prior job in this same run (or a concurrent run) may
          # have already pushed since then, so re-sync to the real current
          # tip before committing, or this push can be rejected as
          # non-fast-forward even though nothing here actually conflicts.
          git add data/observations/korea_breadth_context data/observations/krx_global_universe data/observations/korea_breadth_aggregate
          if git diff --cached --quiet; then
            echo "no change (verified_existing) -- nothing to commit"
          else
            git commit -m "korea breadth context lineage $(date -u +%Y-%m-%d) [P2-03 pair run ${{ github.run_id }}]"
            git push
          fi

  # Real dependency: this job cannot start until the Breadth context
  # commit above has genuinely landed on main -- the checkout below then
  # picks up that real commit before Leadership's own fetch/commit runs,
  # structurally guaranteeing Breadth's real first_seen_at predates
  # Leadership's real available_at (decision_time) for a same-day pair,
  # never a manually-remembered ordering.
  korea-leadership-live-fetch:
    needs: korea-breadth-context-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Re-sync Leadership checks after the Breadth commit
        run: |
          git fetch origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Korea Leadership live-fetch offline contract regression
        run: python3 test/test_korea_leadership_live_fetch.py
      - name: Reuse an exact committed Leadership observation instead of re-fetching the same date
        id: existing_leadership
        env:
          PRIOR_DATE: ${{ inputs.leadership_prior_date }}
          CURRENT_DATE: ${{ inputs.leadership_current_date }}
        run: |
          ISO_DATE="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          CONTEXT_PATH="data/observations/korea_leadership_context/$ISO_DATE/packet.json"
          if test -f "$CONTEXT_PATH"; then
            python3 .github/scripts/korea_leadership_live_fetch.py \
              --prior-date "$PRIOR_DATE" \
              --current-date "$CURRENT_DATE" \
              --verify-existing-only
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Korea Leadership real KRX index fetch attempt
        if: steps.existing_leadership.outputs.exists != 'true'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRIOR_DATE: ${{ inputs.leadership_prior_date }}
          CURRENT_DATE: ${{ inputs.leadership_current_date }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_leadership_live_fetch.py \
            --prior-date "$PRIOR_DATE" \
            --current-date "$CURRENT_DATE"
      - name: Commit Korea Leadership live-fetch attempt evidence
        if: steps.existing_leadership.outputs.exists != 'true'
        run: |
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          # Same real fix as the Breadth commit job above: this job's own
          # checkout is pinned to the SHA fixed at workflow_dispatch start,
          # not main's live tip -- it does NOT include the Breadth job's own
          # commit that just landed a moment ago in this same run. Re-sync to
          # the real current tip (which now genuinely includes that Breadth
          # commit) before committing, so this push is a real fast-forward
          # instead of being rejected as diverged from a stale base.
          git fetch origin main
          git reset --hard origin/main
          git add data/observations/korea_leadership_context
          if git diff --cached --quiet; then
            echo "no change (verified_existing) -- nothing to commit"
          else
            git commit -m "korea leadership live-fetch attempt $(date -u +%Y-%m-%d) [P2-03 pair run ${{ github.run_id }}]"
            git push
          fi

  # Build the already-ratified P2-03 packet from the exact Breadth ->
  # Leadership evidence this run committed. This is deliberately an artifact
  # handoff only: no rolling pointer, state ledger, Stage3 consumer, schedule,
  # promotion, order, capital or trading authority is added here.
  korea-current-ratified-rotation-proof:
    needs: korea-leadership-live-fetch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CI contract dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Bind the exact committed observation pair
        run: |
          # This checkout starts at the dispatch SHA. Both producer jobs may
          # have appended evidence since then, so consume the real main tip
          # only after the dependency-ordered commits completed.
          git fetch origin main
          git reset --hard origin/main
          test -z "$(git status --porcelain)"
      - name: Current-ratified producer focused regression
        run: |
          python3 test/test_korea_capital_rotation_current_ratified_proof.py
          python3 test/test_korea_capital_rotation_policy_ratified.py
          python3 test/test_korea_capital_rotation_ledger_proof.py
      - name: Build current-ratified Korea rotation packet
        env:
          PRIOR_DATE: ${{ inputs.leadership_prior_date }}
          CURRENT_DATE: ${{ inputs.leadership_current_date }}
        run: |
          PRIOR_ISO="${PRIOR_DATE:0:4}-${PRIOR_DATE:4:2}-${PRIOR_DATE:6:2}"
          CURRENT_ISO="${CURRENT_DATE:0:4}-${CURRENT_DATE:4:2}-${CURRENT_DATE:6:2}"
          python3 .github/scripts/korea_capital_rotation_ledger_proof.py \
            --prior-date "$PRIOR_ISO" \
            --current-date "$CURRENT_ISO" \
            --current-ratified-policy \
            --packet-out "$RUNNER_TEMP/p2-03-current-ratified/packet.json"
          PACKET="$RUNNER_TEMP/p2-03-current-ratified/packet.json"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$PACKET")" = "ROTATION_BUCKETS_OBSERVED"
          test "$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["rotation_policy_effective"]).lower())' "$PACKET")" = "true"
          git rev-parse HEAD > "$RUNNER_TEMP/p2-03-current-ratified/public-main-commit.txt"
      - name: Upload current-ratified Korea rotation Stage3 handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: p2-03-current-ratified-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-03-current-ratified
          if-no-files-found: error
