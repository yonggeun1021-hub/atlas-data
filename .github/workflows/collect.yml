name: Atlas Daily Collect

on:
  schedule:
    # ★★ GitHub schedule 은 best-effort 다 — 고부하 시 지연되거나 실행이 아예 드롭된다.
    #    (공식 문서: "During periods of high load, your scheduled workflow may be delayed",
    #     그리고 정시 :00 스케줄은 피하라고 권고)
    #    따라서 슬롯을 하나만 두지 않고 3개를 건다. 먼저 성공한 회차가 데이터를 만들고,
    #    뒤 회차는 아래 Guard 스텝이 스스로 종료시킨다.  (CIO 승인 2026-08-14)
    - cron: '5 21 * * 0-4'    # 06:05 KST — 본 회차
    - cron: '25 21 * * 0-4'   # 06:25 KST — 1차 백업
    - cron: '45 21 * * 0-4'   # 06:45 KST — 2차 백업 (07:00 브리핑 전 마지막 기회)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # P0-02 — GitHub scheduler 지연을 커밋 시각으로 역산하지 않는다.
      # runner가 실제로 명령을 실행하기 시작한 첫 UTC 시각을 먼저 고정한다.
      - name: Capture runner start time (P0-02)
        id: runner_start
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "observed_started_at_utc=$STARTED_AT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ────────────────────────────────────────────────────────────────
      # Guard — 오늘자(KST) '정상' 수집분이 이미 있으면 이 회차는 건너뛴다.
      #   · 백업 슬롯이 중복 수집·중복 커밋을 만들지 않게 하는 유일한 장치
      #   · failed > 0 이면 정상 수집분으로 보지 않고 재수집한다
      #   · 파일이 없거나 파싱 실패해도 재수집한다 (안전한 기본값 = 수집)
      # ────────────────────────────────────────────────────────────────
      - name: Guard — 오늘자 수집 여부 확인
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          # guard.py 는 사실만 말한다 — fresh(오늘자+실패0) / stale(그 외)
          # 판단이 안 서면 stale 이므로 여기서는 '수집한다' 로 귀결된다
          RESULT=$(TODAY="$TODAY" python3 .github/scripts/guard.py || echo stale)
          if [ "$RESULT" = "fresh" ]; then SKIP=yes; else SKIP=no; fi
          echo "today_kst=$TODAY / krx+dart+sec=$RESULT / skip=$SKIP"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Collector 재수집 생략 사유 표시
        if: steps.guard.outputs.skip == 'yes'
        run: echo "오늘자 정상 수집분이 이미 있습니다 — collector 재수집은 생략하고 briefing read model 검증/repair는 계속합니다."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.guard.outputs.skip != 'yes'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        if: steps.guard.outputs.skip != 'yes'
        run: pip install -r requirements.txt

      - name: Collect KRX
        if: steps.guard.outputs.skip != 'yes'
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONPATH: collectors
        run: python collectors/krx.py

      # P1-KR-06 — the source response does not expose an official publication
      # timestamp.  After the regular collector has established a prior
      # confirmed KRX session, capture the first exact KOSPI Open API response
      # Atlas actually observes.  This step persists timing/hash evidence only:
      # no index level, risk feature, Regime score, or trading authority.
      - name: Capture next-session KOSPI availability (P1-KR-06)
        id: korea_risk_availability
        if: always()
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          test -n "$KRX_API_KEY" || { echo "STOP: KRX_API_KEY secret missing"; exit 2; }
          python3 .github/scripts/korea_risk_availability.py

      - name: Collect DART
        if: always() && steps.guard.outputs.skip != 'yes'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONPATH: collectors
        run: python collectors/dart.py

      # ★ 미국 공시(SEC) — 2026-08-14 정기 수집에 편입.
      #   그전까지 sec.py 는 sec_probe.yml(수동)에서만 돌았고 결과를 아티팩트로만 올려
      #   저장소에 data/latest_sec.json 이 남지 않았다. 그래서 Step 0 이 읽을 수 없었다.
      #   수집기는 이미 완성돼 있었고, 빠져 있던 것은 배선뿐이다.
      - name: Collect SEC
        id: sec
        if: always() && steps.guard.outputs.skip != 'yes'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONPATH: collectors
        run: python collectors/sec.py

      # ────────────────────────────────────────────────────────────────
      # D1 게이트 — 낡은 SEC 로 분류하는 것을 막는다  (CIO 코드리뷰 2026-08-14)
      #
      #   event_classifier.py 는 data/latest_sec.json 이 '존재하면' 실행된다.
      #   존재 여부만 볼 뿐 collected_for_kst_date 를 검사하지 않는다.
      #   따라서 오늘 SEC 가 실패했는데 어제 파일이 남아 있으면
      #   D1 이 그 낡은 입력을 다시 읽고 **초록불로 끝난다** — 실패가 숨는다.
      #
      #   그래서 두 조건을 모두 만족할 때만 D1 을 실행한다.
      #     ① Collect SEC 스텝이 success
      #     ② data/latest_sec.json 의 collected_for_kst_date 가 오늘(KST)
      # ────────────────────────────────────────────────────────────────
      - name: D1 게이트 — SEC 산출물 신선도 확인
        id: d1gate
        if: always() && steps.guard.outputs.skip != 'yes'
        run: |
          if [ "${{ steps.sec.outcome }}" != "success" ]; then
            echo "SEC step outcome=${{ steps.sec.outcome }} → D1 실행하지 않음 (낡은 입력 재사용 방지)"
            echo "run=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          RESULT=$(TODAY="$TODAY" python3 .github/scripts/guard.py data/latest_sec.json || echo stale)
          if [ "$RESULT" = "fresh" ]; then RUN=yes; else RUN=no; fi
          echo "today_kst=$TODAY / latest_sec=$RESULT / D1 run=$RUN"
          if [ "$RUN" = "no" ]; then
            echo "⚠ SEC 스텝은 성공했으나 산출물이 오늘자가 아니거나 실패가 남아 있음 → D1 건너뜀"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      # ★ Decision Layer D1 — 2026-08-14 CIO 정기 편입 승인.
      #   SEC → event_classifier → event_records 는 Discovery Layer 이므로 매일 자동으로 돈다.
      #   ⚠ 반드시 Collect SEC 뒤에 온다 — 입력이 data/latest_sec.json 이다.
      #   ⚠ if 조건은 always() 가 아니라 위 게이트 결과다. SEC 가 오늘자로 성공했을 때만 돈다.
      #   ※ portfolio/constitution.py 는 자동 편입하지 않는다 — 헌법은 사람이 읽는 층이며
      #     IC 수동 실행을 유지한다 (CIO 확정 2026-08-14).
      - name: Classify Events (Decision Layer D1)
        if: always() && steps.d1gate.outputs.run == 'yes'
        env:
          PYTHONPATH: collectors:decision
        run: python decision/event_classifier.py

      # P4-03 — DART metadata 도착과 공시 본문 소비를 같은 성공으로 뭉개지 않는다.
      # Guard=fresh 여도 이전 원문 실패는 독립적으로 repair할 수 있어야 하므로
      # always()에서 실행한다. item extraction policy는 아직 미비준이므로
      # 원문 ZIP/hash/member index만 보존하고 Rule/해석 권한은 계속 차단한다.
      - name: Capture DART filing content (P4-03)
        id: dart_content
        if: always()
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 collectors/dart_filing_content.py \
            --source data/latest_dart.json \
            --data-root data \
            --expected-kst-date "$TODAY" \
            --observed-at-utc "$OBSERVED_AT"

      # P3-08 — record exact OpenDART relevant-filing observations from the
      # already-collected metadata and retained P4-03 bytes.  The adapter is
      # provider-free and deliberately leaves event type, direction,
      # importance, notification, Action, Order and trading authority closed.
      - name: Populate DART Event Observations (P3-08)
        if: always()
        run: |
          DECISION_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 discovery/dart_event_observation.py \
            --decision-at "$DECISION_AT" \
            --source data/latest_dart.json \
            --content data/latest_dart_content.json \
            --data-root data \
            --out-root data/observations/dart_event_observations

      # P4-02 — metadata 도착과 filing 본문 소비를 같은 성공으로 뭉개지 않는다.
      # Guard=fresh 여도 이전 content 실패는 독립적으로 repair할 수 있어야 하므로
      # always()에서 실행한다. helper가 latest_sec의 오늘 KST 날짜를 다시 검증한다.
      # 실패 상태도 latest_sec_content.json으로 남겨 아래 Commit data가 보존한다.
      - name: Capture SEC filing content (P4-02)
        id: sec_content
        if: always()
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 collectors/sec_filing_content.py \
            --source data/latest_sec.json \
            --data-root data \
            --expected-kst-date "$TODAY" \
            --observed-at-utc "$OBSERVED_AT"

      # P3-08 — existing SEC D1 records become operational Discovery Cases.
      # No provider call or new importance policy is introduced here.  The
      # adapter links evidence only when the already-retained filing-content
      # gzip bytes match the exact manifest accession/URL/hash; every other
      # case remains honestly EVIDENCE_UNRESOLVED.  Output is content-addressed
      # and append-only, while all promotion/Rule/action/trading authority
      # remains false in the reused event_case contract.
      - name: Populate SEC Event Discovery Cases (P3-08)
        if: always()
        run: |
          DECISION_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 discovery/event_population.py \
            --decision-at "$DECISION_AT" \
            --out-root data/observations/event_discovery_cases

      # P9-02 — normalize the exact published P3-08 packet into the detector's
      # observation-batch contract without inventing importance or a filing
      # timestamp.  Current SEC cases are date-only, so every row remains
      # explicitly BLOCKED and cannot be escalated even if a policy is later
      # supplied.  No provider call, notification, action, or trading authority.
      - name: Populate Important Event Observations (P9-02)
        if: always()
        run: |
          OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 execution/important_event_observation_population.py \
            --observed-at "$OBSERVED_AT" \
            --event-root data/observations/event_discovery_cases \
            --out-root data/observations/important_event_observations

      # P3-05 — provider-free Business Acceleration population from the
      # already-retained P4-02 TSM SEC monthly-report manifests/raw bytes.
      # Three consecutive decision-time-eligible reports are required; no
      # fixture, threshold, ranking, Stage, Rule, action or trading fallback.
      - name: Populate Business Acceleration Radar (P3-05)
        if: always()
        run: |
          DECISION_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 discovery/business_acceleration_population.py \
            --decision-at "$DECISION_AT" \
            --out-root data/observations/business_acceleration

      # P0-03 — 브리핑 전용 경량 read model.
      # 대형 latest_*.json 을 브리핑 클라이언트가 직접 읽지 않도록
      # Step 0 상태 + 종목별 compact view 를 수집 결과에서 생성한다.
      # Guard=fresh 는 collector 재수집만 생략한다.
      # briefing read model 은 stale/partial/degraded 일 수 있으므로 항상 검증·재빌드한다.
      # builder 는 temp build → atomic publish 이므로 실패 시 기존 published bundle을 보존한다.
      - name: Build briefing read model (P0-03)
        if: always()
        env:
          TZ: Asia/Seoul
        run: |
          TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/build_briefing_inputs.py --today "$TODAY"

      # 생성시점의 freshness/overall을 그대로 믿지 않는다. 현재 raw 3종의
      # 날짜·failed를 먼저 재검증한 뒤 published bundle/health/hash를 확인한다.
      # 실패해도 아래 telemetry/commit은 always()로 실행되어 degraded marker를 보존한다.
      - name: Verify 06:55 briefing readiness contract (P0-03)
        if: always()
        env:
          TZ: Asia/Seoul
        run: |
          TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/check_briefing_readiness.py \
            --today "$TODAY" --write-health

      # scheduled/manual 및 Guard skip을 같은 계약으로 기록한다.
      # 데이터 provider를 추가 호출하지 않으며, 실패해도 아래 Commit data가
      # collector/read-model 결과를 보존할 수 있도록 always()에서 실행한다.
      - name: Record scheduler telemetry (P0-02)
        if: always()
        env:
          ATLAS_EVENT_NAME: ${{ github.event_name }}
          ATLAS_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ATLAS_RUN_ID: ${{ github.run_id }}
          ATLAS_RUN_ATTEMPT: ${{ github.run_attempt }}
          ATLAS_RUNNER_STARTED_AT_UTC: ${{ steps.runner_start.outputs.observed_started_at_utc }}
          ATLAS_GUARD_RESULT: ${{ steps.guard.outputs.result }}
          ATLAS_GUARD_SKIP: ${{ steps.guard.outputs.skip }}
        run: python3 .github/scripts/record_collect_run.py

      # Guard=fresh 인 manual run도 read-model-only repair 결과를 저장할 수 있어야 한다.
      # 실제 변경이 없으면 아래 git diff --staged --quiet 에서 커밋 없이 종료한다.
      - name: Commit data
        if: always()
        env:
          # ★ 어느 트리거가 이 수집을 성사시켰는지 기록한다.
          #   schedule 이면 실제 발동한 cron 식이, 수동이면 workflow_dispatch 가 들어온다.
          #   이 값이 쌓여야 "06:05 가 계속 이기는가 / 백업이 자주 받아내는가"를
          #   측정할 수 있다. 이것 없이는 스케줄 신뢰도를 사후에 알 방법이 없다.
          TRIGGER: ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/ config/corp_map.json || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            # ★ KST 기준 (UTC 로 찍으면 06시 KST 실행분이 전날 날짜로 기록됨)
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) collect [${TRIGGER}]"
            git push
          fi
