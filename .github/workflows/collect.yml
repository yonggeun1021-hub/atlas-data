name: Atlas Daily Collect

on:
  schedule:
    # 21:05 UTC (일~목) = 06:05 KST (월~금)
    # ★ 정시(:00)는 GitHub 고부하 시 지연·드롭이 잦아 공식 문서가 회피를 권고 → :05 로 이동 (CIO 승인 2026-08-14)
    - cron: '5 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect KRX
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONPATH: collectors
        run: python collectors/krx.py

      - name: Collect DART
        if: always()
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONPATH: collectors
        run: python collectors/dart.py

      - name: Commit data
        if: always()
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/ config/corp_map.json || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) collect"   # ★ KST 기준 (UTC면 06시 실행분이 전날로 찍힘)
            git push
          fi
