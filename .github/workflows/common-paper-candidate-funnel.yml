name: Common three-market PAPER candidate funnel and decision receipt

on:
  pull_request:
    paths:
      - "config/common_paper_candidate_funnel_contract.json"
      - "schemas/common_paper_candidate_funnel.schema.json"
      - "decision/common_paper_candidate_funnel.py"
      - "config/paper_decision_bridge_contract.json"
      - "schemas/paper_decision_bridge.schema.json"
      - "decision/paper_decision_bridge.py"
      - "docs/paper_decision_bridge_contract.md"
      - "test/fixtures/common_paper_candidate_funnel/**"
      - "test/fixtures/paper_decision_bridge/**"
      - "test/common_paper_candidate_funnel/**"
      - "test/paper_decision_bridge/**"
      - ".github/workflows/common-paper-candidate-funnel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-paper-funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Deterministic funnel and authority regression
        run: python3 test/common_paper_candidate_funnel/test_funnel.py
      - name: Decision receipt lifecycle and integrity regression
        run: python3 test/paper_decision_bridge/test_bridge.py
      - name: No tracked mutation
        run: git diff --exit-code
