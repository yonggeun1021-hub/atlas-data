name: IC weekly control contract
on:
  pull_request:
    paths:
      - 'audit/ic_weekly_control.py'
      - 'config/ic_weekly_control_packet.schema.json'
      - 'evidence/ic_weekly_control/**'
      - 'services/ic_weekly_control/**'
      - 'validation/tests/test_ic_weekly_control.py'
      - '.github/workflows/ic-weekly-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ic-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python3 validation/tests/test_ic_weekly_control.py
# No schedule: external ChatGPT weekly IC owns Saturday, existing local tick consumes.
